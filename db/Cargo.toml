[package]
name = "omnibus-db"
version = "0.1.0"
edition = "2021"
license.workspace = true

# Server-side data layer: schema migrations, SQLite pool init, query layer,
# and the indexing pipeline (file scanner → ebook metadata extraction →
# atomic per-library upsert). Consumed by both `server/` (axum handlers) and
# `frontend/` (Dioxus server functions under the `server` feature).

[dependencies]
omnibus-shared = { path = "../shared" }
# held at 0.8: 0.9 requires `impl SqlSafeStr` on every `query*()` call — the ~55
# dynamic-SQL sites here (`sqlx::query(&sql)` / `&format!(...)`) would each need
# an `AssertSqlSafe(...)` wrap, and the combined `runtime-tokio-rustls` feature
# is split into `runtime-tokio` + `tls-rustls-*`. That's a nontrivial migration,
# out of scope for this staleness bump; track it as a follow-up.
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util"] }
anyhow = "1"
thiserror.workspace = true
# `join_all` for the cold-path admin loops that fan out N per-item network
# calls (Open Library / Hardcover) in bounded chunks instead of running them
# fully sequentially. Not `futures::stream::{buffered, buffer_unordered}` —
# those trip a rustc higher-ranked-lifetime auto-trait inference bug
# elsewhere in this crate (see the comment in `suggestions/hardcover.rs`).
futures = "0.3"
epub = "2"
serde.workspace = true
serde_json.workspace = true

# F0.6 library filesystem: ASCII-fold author/title slugs ("Café" → "cafe",
# "東京" → "dong-jing") so canonical-layout folder names stay tool-agnostic.
deunicode = "1"

# F0.6 library filesystem: structured logging when sidecar materialization
# falls back to embedded covers (read-only fs, etc.). Subscriber is set up
# by the binary; library code only emits events.
tracing.workspace = true

# Auth (F0.3). Argon2id password hashing, CSPRNG token generation, SHA-256
# of the raw token for at-rest storage, base64url for wire-format tokens.
# getrandom is used directly (via `getrandom::fill`) for CSPRNG token/key
# generation in token.rs / session_key.rs — it is already a transitive dep
# via sqlx/argon2, so using it directly avoids pulling in the pre-1.0 rand
# crate for this security-critical path. rand_core carries `getrandom` so
# that OsRng is available for SaltString::generate in password.rs.
#
# held at 0.5: argon2 0.6 has never shipped a *stable* release — the latest
#   published version is a release candidate (0.6.0-rc.*), and we don't ship
#   an RC of password-hashing code. 0.5.3 has no open advisories. Revisit
#   when 0.6.0 final lands; the bump then also pulls password-hash 0.6 (and
#   rand_core 0.9), which is why rand_core is lock-stepped below.
argon2 = "0.5" # held at 0.5: no stable 0.6 upstream (latest is 0.6.0-rc.*)
getrandom = "0.3"
# held at 0.6: rand_core exists here only to flip on the `getrandom` feature
#   on the *same* 0.6 instance argon2 0.5's transitive `password-hash` 0.5
#   pulls in, so OsRng reaches SaltString::generate. A 0.9 direct bump would
#   be dead weight (a separate version that never reaches argon2's OsRng)
#   until argon2 0.6 stabilizes and moves password-hash to rand_core 0.9.
rand_core = { version = "0.6", features = ["getrandom"] } # held at 0.6: tied to argon2 0.5's password-hash
sha2 = "0.11"
base64 = "0.22"

# F1.2 thumbnail pipeline: decode EPUB covers (JPEG/PNG/WebP/GIF) and re-encode
# as WebP at multiple sizes. Only the listed formats are enabled to keep
# compile times and binary size down. `gif` is enabled so a cover whose bytes
# are actually a GIF (even when mislabelled `image/jpeg`) decodes to its first
# frame instead of failing `The image format Gif is not supported` (#828).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

# HTML sanitization for EPUB description fields (issue #62) and F3.2 journal
# entries. OPF `<dc:description>` is often HTML; journal bodies are
# user-authored markdown. Both are rendered server-side and sanitized with a
# strict allowlist so `book_detail` can render them via `dangerous_inner_html`
# without exposing XSS. Done at read time so stored rows are always sanitized.
ammonia = "4"

# F3.2 journals: render user-authored markdown to HTML server-side (then
# sanitized by `ammonia` above). Strikethrough is enabled to match the
# composer's formatting affordances; a custom `||spoiler||` pass runs first.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# F2.3 audiobook metadata: read title/artist/album/duration and embedded
# cover artwork from m4b/m4a/mp3 (and any other container lofty supports).
# Chosen over `mp4ameta` so mp3 works through the same Tag API without an
# ffprobe fallback.
lofty = "0.24"


# `v4` mints the durable, content-independent `books.uuid` (F2): a fresh
# random id per book, assigned once at insert and never recomputed, so two
# distinct books that share a title/author (or even identical bytes) can never
# collide on identity. `v5` remains for the legacy toolchain-independent cover
# id derivation (issue #94); it is no longer the book identity / diff key.
uuid = { version = "1", features = ["v4", "v5"] }

# F1.11 author profile photos: outbound HTTP for the Open Library resolver
# (`db::author_photos`). rustls-based TLS matches the rest of our async TLS
# choices so we don't pull in OpenSSL. `json` is needed to deserialize the
# `/search/authors.json` response. This is the only outbound HTTP in the
# codebase — keep it scoped to the resolver module.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
urlencoding = "2"

# F4.3 Send-to-Kindle: SMTP delivery of the EPUB as an email attachment.
# rustls-based TLS matches the async-TLS choice used by sqlx/reqwest so we
# never pull in OpenSSL; `builder` provides the multipart `Message` API.
# Default features are off to drop the sync `native-tls` transport and
# file/sendmail transports we don't use.
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "hostname",
    "smtp-transport",
    "tokio1-rustls-tls",
] }

[features]
# Re-exports `test_support` helpers (in-memory pool seeders, `IndexedBook`
# factories, `CoversTempDir`) so external test crates can depend on them
# without re-implementing fixtures. Internal `#[cfg(test)]` builds get the
# module automatically via the `any(test, feature = "test-support")` gate.
test-support = []

[dev-dependencies]
tempfile.workspace = true
wiremock = "0.6"
