[package]
name = "omnibus-db"
version = "0.1.0"
edition = "2021"
license.workspace = true

# Server-side data layer: schema migrations, SQLite pool init, query layer,
# and the indexing pipeline (file scanner → ebook metadata extraction →
# atomic per-library upsert). Consumed by both `server/` (axum handlers) and
# `frontend/` (Dioxus server functions under the `server` feature).

[dependencies]
omnibus-shared = { path = "../shared" }
# Held back at 0.8 (latest is 0.9.0; see issue #774). The `runtime-tokio-rustls`
# feature rename to `runtime-tokio` + `tls-rustls` is a one-line fix, but 0.9
# also adds a new `SqlSafeStr` bound on `query()`/`query_as()` that only
# accepts `&'static str` or an explicit `AssertSqlSafe` wrapper — a compile-time
# "have you audited this for injection" gate. This crate builds dynamic SQL via
# `format!` at 69+ call sites (dynamic table/column names, `IN (...)`
# placeholder lists) that all fail to compile under 0.9 until individually
# wrapped in `AssertSqlSafe`. Doing that safely means auditing each site to
# confirm no user-controlled string reaches the interpolated text — real,
# security-sensitive work that deserves its own reviewed PR, not a drive-by
# fix bundled into a routine dependency bump. Track the migration separately.
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util"] }
anyhow = "1"
thiserror.workspace = true
epub = "2"
serde.workspace = true
serde_json.workspace = true

# F0.6 library filesystem: ASCII-fold author/title slugs ("Café" → "cafe",
# "東京" → "dong-jing") so canonical-layout folder names stay tool-agnostic.
deunicode = "1"

# F0.6 library filesystem: structured logging when sidecar materialization
# falls back to embedded covers (read-only fs, etc.). Subscriber is set up
# by the binary; library code only emits events.
tracing.workspace = true

# Auth (F0.3). Argon2id password hashing, CSPRNG token generation, SHA-256
# of the raw token for at-rest storage, base64url for wire-format tokens.
# getrandom is used directly for CSPRNG token/key generation (it is already
# a transitive dep via sqlx/argon2) to avoid pulling in the pre-1.0 rand 0.8
# crate for this security-critical path. rand_core is pinned to 0.6 (same
# version already in the lock via password-hash) with `getrandom` enabled so
# that OsRng is available for SaltString::generate in password.rs.
#
# Why the version mix isn't uniformly "latest":
# * argon2 0.5 is the latest *stable* release; 0.6 is only available as
#   pre-release (0.6.0-rc.*) and we don't ship release candidates of
#   password-hashing code. 0.5.3 has no open advisories.
# * rand_core stays at 0.6 because argon2 0.5's transitive `password-hash`
#   pulls 0.6, and our direct dep only exists to flip on the `getrandom`
#   feature on that *same* 0.6 instance — a 0.9 direct bump would be dead
#   weight (separate version, doesn't reach argon2's OsRng). Lock-stepped
#   with the argon2 bump above.
argon2 = "0.5"
getrandom = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
base64 = "0.22"

# F1.2 thumbnail pipeline: decode EPUB covers (JPEG/PNG/WebP) and re-encode
# as WebP at multiple sizes. Only the three listed formats are enabled to keep
# compile times and binary size down.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# HTML sanitization for EPUB description fields (issue #62) and F3.2 journal
# entries. OPF `<dc:description>` is often HTML; journal bodies are
# user-authored markdown. Both are rendered server-side and sanitized with a
# strict allowlist so `book_detail` can render them via `dangerous_inner_html`
# without exposing XSS. Done at read time so stored rows are always sanitized.
ammonia = "4"

# F3.2 journals: render user-authored markdown to HTML server-side (then
# sanitized by `ammonia` above). Strikethrough is enabled to match the
# composer's formatting affordances; a custom `||spoiler||` pass runs first.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# F2.3 audiobook metadata: read title/artist/album/duration and embedded
# cover artwork from m4b/m4a/mp3 (and any other container lofty supports).
# Chosen over `mp4ameta` so mp3 works through the same Tag API without an
# ffprobe fallback.
lofty = "0.24"


# `v4` mints the durable, content-independent `books.uuid` (F2): a fresh
# random id per book, assigned once at insert and never recomputed, so two
# distinct books that share a title/author (or even identical bytes) can never
# collide on identity. `v5` remains for the legacy toolchain-independent cover
# id derivation (issue #94); it is no longer the book identity / diff key.
uuid = { version = "1", features = ["v4", "v5"] }

# Outbound HTTP: the Open Library author-photo resolver (`db::author_photos`)
# and the Hardcover GraphQL client (`db::suggestions::hardcover`) are the only
# two consumers — both share this one `reqwest` dep rather than each pulling
# their own. `rustls` matches the rest of our async TLS choices (sqlx uses
# `runtime-tokio-rustls`) so we don't pull in OpenSSL. `json` is needed to
# deserialize both APIs' JSON responses.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
urlencoding = "2"

# F4.3 Send-to-Kindle: SMTP delivery of the EPUB as an email attachment.
# `tokio1-rustls-tls` matches the async-TLS choice used by sqlx/reqwest so we
# never pull in OpenSSL; `builder` provides the multipart `Message` API. Default
# features are off to drop the sync `native-tls` transport and file/sendmail
# transports we don't use.
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "hostname",
    "smtp-transport",
    "tokio1-rustls-tls",
] }

[features]
# Re-exports `test_support` helpers (in-memory pool seeders, `IndexedBook`
# factories, `CoversTempDir`) so external test crates can depend on them
# without re-implementing fixtures. Internal `#[cfg(test)]` builds get the
# module automatically via the `any(test, feature = "test-support")` gate.
test-support = []

[dev-dependencies]
tempfile.workspace = true
wiremock = "0.6"
