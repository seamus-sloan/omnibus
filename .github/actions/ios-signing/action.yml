name: "iOS signing setup"
description: >
  Import an Apple Distribution certificate into a throwaway keychain and install
  an App Store provisioning profile. Used by the TestFlight ios job; kept as a
  composite action so the security-sensitive keychain code lives in one place.
  The keychain persists for the rest of the job; delete it in an always()
  cleanup step using the `keychain-path` output.

inputs:
  cert-p12-base64:
    description: "base64 of the Apple Distribution .p12 (exported WITH its private key)"
    required: true
  cert-password:
    description: "password for the .p12"
    required: true
  profile-base64:
    description: "base64 of the App Store .mobileprovision for the app being built"
    required: true
  extension-profile-base64:
    description: >
      base64 of the App Store .mobileprovision for the embedded app extension,
      when the app has one. A profile is bound to exactly one bundle ID, so an
      appex needs its own — manual signing at -exportArchive time otherwise
      fails with "OmnibusWidgets.appex requires a provisioning profile", and
      nothing before that step can catch it because the archive is built
      unsigned and simulator builds sign ad-hoc. Optional, so an app with no
      extension needs no second secret.
    required: false
    default: ""
  expected-bundle-id:
    description: >
      Bundle ID the app profile must be for. Checked against the profile's own
      `application-identifier` entitlement, which is the only copy of Apple's
      answer that reaches CI — the portal is the authority here, so comparing
      the workflow against the Xcode project proves nothing (the two have
      agreed while both disagreed with Apple). Optional; skipped when empty
      and always satisfied by a wildcard profile.
    required: false
    default: ""
  expected-extension-bundle-id:
    description: "Same, for the embedded extension's profile."
    required: false
    default: ""
  require-app-group:
    description: >
      App Group both profiles must carry, e.g. group.com.omnibus.mobile. A
      profile generated before the capability was added to its App ID silently
      lacks the entitlement and fails export with a mismatch that names
      neither the group nor the fix. Optional; skipped when empty.
    required: false
    default: ""
  expected-team:
    description: >
      Team ID the profile must belong to. Set it on any job that resolves the
      profile by name (xcodebuild's PROVISIONING_PROFILE_SPECIFIER): a mismatch
      there surfaces only as Xcode's opaque "No profile for team X matching Y
      found", which names the team it wanted but never the one it got.
    required: false
    default: ""

outputs:
  signing-identity:
    description: "SHA-1 hash of the codesigning identity (codesign matches the hash exactly)"
    value: ${{ steps.cert.outputs.identity }}
  keychain-path:
    description: "Path to the throwaway keychain — delete it in an always() cleanup step"
    value: ${{ steps.cert.outputs.keychain }}
  profile-path:
    description: "Path to the decoded .mobileprovision file (the dx path embeds this directly)"
    value: ${{ steps.profile.outputs.path }}
  profile-uuid:
    description: "UUID of the provisioning profile"
    value: ${{ steps.profile.outputs.uuid }}
  profile-name:
    description: "Name of the provisioning profile (for PROVISIONING_PROFILE_SPECIFIER / ExportOptions)"
    value: ${{ steps.profile.outputs.name }}
  profile-team:
    description: "Team ID the provisioning profile belongs to"
    value: ${{ steps.profile.outputs.team }}
  extension-profile-name:
    description: >
      Name of the extension's provisioning profile, for the second
      ExportOptions `provisioningProfiles` entry. Empty when none was supplied.
    value: ${{ steps.extension-profile.outputs.name }}

runs:
  using: composite
  steps:
    # Import the distribution cert into a throwaway keychain so codesign can find
    # the identity. `-D` is the BSD/macOS base64 decode flag (`--decode` is a GNU
    # long-opt some macOS images lack); these steps run outside nix on the runner.
    - name: Import signing certificate
      id: cert
      shell: bash
      env:
        CERT_P12_BASE64: ${{ inputs.cert-p12-base64 }}
        CERT_PASSWORD: ${{ inputs.cert-password }}
      run: |
        set -euo pipefail
        KEYCHAIN="$RUNNER_TEMP/omnibus-signing.keychain-db"
        KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
        CERT_P12="$RUNNER_TEMP/dist.p12"
        echo "$CERT_P12_BASE64" | base64 -D > "$CERT_P12"

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security import "$CERT_P12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
          -T /usr/bin/codesign -T /usr/bin/security
        # Let codesign use the key without an interactive prompt.
        security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
        # Prepend our keychain to the user search list so codesign/xcodebuild see it.
        # Intentional word-splitting: each existing keychain path is a separate -s argument.
        # shellcheck disable=SC2046
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
        rm -f "$CERT_P12"

        # Derive the identity's SHA-1 from the imported cert rather than trusting a
        # hand-entered name — codesign matches the hash exactly. Fail loudly (dumping
        # what's present) if the cert has no usable codesigning identity — the usual
        # cause is a .p12 exported without its private key.
        IDENTITY_HASH="$(security find-identity -v -p codesigning "$KEYCHAIN" \
          | awk 'match($0, /[0-9A-F]{40}/) { print substr($0, RSTART, RLENGTH); exit }')"
        if [ -z "$IDENTITY_HASH" ]; then
          echo "::error::No codesigning identity in the imported keychain — the cert must be an Apple Distribution cert exported WITH its private key."
          security find-identity -v -p codesigning "$KEYCHAIN" || true
          exit 1
        fi
        echo "Using codesigning identity $IDENTITY_HASH"
        echo "identity=$IDENTITY_HASH" >> "$GITHUB_OUTPUT"
        echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"

    # Decode the profile and install it where xcodebuild looks. The dx path reads
    # the file directly by `profile-path`; the native path resolves it by name/UUID.
    - name: Install provisioning profile
      id: profile
      shell: bash
      env:
        PROFILE_BASE64: ${{ inputs.profile-base64 }}
        EXPECTED_TEAM: ${{ inputs.expected-team }}
        EXPECTED_BUNDLE_ID: ${{ inputs.expected-bundle-id }}
        REQUIRE_APP_GROUP: ${{ inputs.require-app-group }}
      run: |
        set -euo pipefail
        PROFILE="$RUNNER_TEMP/omnibus.mobileprovision"
        echo "$PROFILE_BASE64" | base64 -D > "$PROFILE"

        # Read UUID + Name + team out of the profile's decoded plist.
        PLIST="$RUNNER_TEMP/profile.plist"
        security cms -D -i "$PROFILE" > "$PLIST"
        UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PLIST")"
        NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PLIST")"
        TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PLIST")"

        if [ -n "$EXPECTED_TEAM" ] && [ "$TEAM" != "$EXPECTED_TEAM" ]; then
          echo "::error::Profile '$NAME' belongs to team $TEAM, but the build signs as $EXPECTED_TEAM. The cert, the profile, and DEVELOPMENT_TEAM must all name one team."
          exit 1
        fi

        # Fail here rather than after the archive. Export is the first thing
        # that compares the profile to the binary, and by then the run has
        # spent ten minutes building.
        bash "$GITHUB_ACTION_PATH/check-profile.sh" \
          "$PLIST" "$NAME" "$EXPECTED_BUNDLE_ID" "$REQUIRE_APP_GROUP"

        # Install into every dir xcodebuild searches, keyed by UUID as Xcode
        # expects. Xcode 16 moved the search path to ~/Library/Developer/Xcode/
        # UserData and no longer reads the legacy ~/Library/MobileDevice one, so
        # on the macos-26 image (Xcode 26) only the former resolves
        # PROVISIONING_PROFILE_SPECIFIER; write both to stay version-agnostic.
        for INSTALL_DIR in \
          "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
          "$HOME/Library/MobileDevice/Provisioning Profiles"; do
          mkdir -p "$INSTALL_DIR"
          cp "$PROFILE" "$INSTALL_DIR/$UUID.mobileprovision"
        done

        echo "Installed profile '$NAME' ($UUID), team $TEAM"
        echo "path=$PROFILE" >> "$GITHUB_OUTPUT"
        echo "uuid=$UUID" >> "$GITHUB_OUTPUT"
        echo "name=$NAME" >> "$GITHUB_OUTPUT"
        echo "team=$TEAM" >> "$GITHUB_OUTPUT"

    # Same again for the embedded extension. A separate step rather than a loop
    # inside the one above because it is conditional: an app with no appex
    # supplies no secret and this is skipped, leaving the output empty so the
    # caller adds no second ExportOptions entry.
    - name: Install extension provisioning profile
      id: extension-profile
      if: inputs.extension-profile-base64 != ''
      shell: bash
      env:
        PROFILE_BASE64: ${{ inputs.extension-profile-base64 }}
        EXPECTED_TEAM: ${{ inputs.expected-team }}
        EXPECTED_BUNDLE_ID: ${{ inputs.expected-extension-bundle-id }}
        REQUIRE_APP_GROUP: ${{ inputs.require-app-group }}
      run: |
        set -euo pipefail
        PROFILE="$RUNNER_TEMP/omnibus-extension.mobileprovision"
        echo "$PROFILE_BASE64" | base64 -D > "$PROFILE"

        PLIST="$RUNNER_TEMP/extension-profile.plist"
        security cms -D -i "$PROFILE" > "$PLIST"
        UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PLIST")"
        NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PLIST")"
        TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PLIST")"

        if [ -n "$EXPECTED_TEAM" ] && [ "$TEAM" != "$EXPECTED_TEAM" ]; then
          echo "::error::Extension profile '$NAME' belongs to team $TEAM, but the build signs as $EXPECTED_TEAM."
          exit 1
        fi

        bash "$GITHUB_ACTION_PATH/check-profile.sh" \
          "$PLIST" "$NAME" "$EXPECTED_BUNDLE_ID" "$REQUIRE_APP_GROUP"

        for INSTALL_DIR in \
          "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
          "$HOME/Library/MobileDevice/Provisioning Profiles"; do
          mkdir -p "$INSTALL_DIR"
          cp "$PROFILE" "$INSTALL_DIR/$UUID.mobileprovision"
        done

        echo "Installed extension profile '$NAME' ($UUID), team $TEAM"
        echo "name=$NAME" >> "$GITHUB_OUTPUT"
