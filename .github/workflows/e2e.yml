name: E2E

on:
  push:
    branches: [main]
  # No workflow-level `paths:` filter: this workflow must run on EVERY PR so
  # its `e2e-required` gate always reports a status (a required check keyed on
  # a path-filtered workflow never resolves on a PR that doesn't match, which
  # blocks the merge forever). Path gating moved into the `changes` job below;
  # `bundle`/`playwright` skip when nothing E2E-relevant changed, and the gate
  # treats skipped as pass. `workflow_dispatch` stays the force-run escape
  # hatch for a PR that touches none of the E2E paths.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect whether this PR touches anything that can change the web bundle or
  # the test suite. On push / workflow_dispatch the real jobs run
  # unconditionally, so this output is only consulted for pull_request events.
  # Keep the filter list in sync with the bundle cache key below.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    # `pull-requests: read` so `dorny/paths-filter` can list the PR's changed
    # files via the API under restrictive permissions (matches release.yml).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            e2e:
              - "frontend/**"
              - "shared/**"
              - "server/**"
              - "db/**"
              - "ui_tests/**"
              - "**/Cargo.toml"
              - "Cargo.lock"
              - "**/Dioxus.toml"
              - "flake.lock"
              - "flake.nix"
              - "scripts/fetch-fixtures.sh"
              - ".github/workflows/e2e.yml"
              - ".github/actions/ci-gate/action.yml"
              - ".github/actions/publish-playwright-report/**"
  # Compile the fullstack web bundle (native server binary + WASM client)
  # in release mode once and stash it in the GHA cache. Release mode strips
  # the Dioxus hot-reload client from the WASM bundle, which otherwise
  # injects a "Your app is being rebuilt" overlay that corrupts the DOM.
  # Cache key covers every input that can change compiled output: the
  # lockfile, per-crate manifests, the workspace crates that feed the web
  # build, the Dioxus bundle config, the flake (toolchain pin), and this
  # workflow file. Keep the `paths:` trigger above in sync.
  bundle:
    name: bundle
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      CARGO_TARGET_DIR: ./target
    outputs:
      cache-key: ${{ steps.bundle-key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute bundle cache key
        id: bundle-key
        run: |
          key="dx-bundle-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '**/Dioxus.toml', 'flake.lock', 'flake.nix', 'frontend/**', 'shared/**', 'server/**', 'db/**', '.github/workflows/e2e.yml') }}"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # Split restore + save so the save happens as a normal step right after
      # the bundle, BEFORE `Swatinem/rust-cache`'s post-step cleans `target/`.
      # If we used `actions/cache@v4` (combined), its post-step would run
      # AFTER rust-cache's cleanup — GHA runs post-steps in reverse
      # declaration order — and find an empty path. (We learned that the
      # hard way; see https://github.com/seamus-sloan/omnibus/pull/319.)
      - name: Restore dx bundle cache
        id: bundle-cache
        uses: actions/cache/restore@v4
        with:
          path: target/dx/omnibus/release/web
          key: ${{ steps.bundle-key.outputs.key }}

      - name: Install Nix
        if: steps.bundle-cache.outputs.cache-hit != 'true'
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Cache Nix store
        if: steps.bundle-cache.outputs.cache-hit != 'true'
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-e2e-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-e2e-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-e2e-${{ runner.os }}-
          purge-last-accessed: 604800
          purge-primary-key: never
          gc-max-store-size-linux: 5G

      # Same `shared-key` as rust.yml so a warm `cargo` target dir from the
      # Rust workflow primes the native half of `dx bundle` here (and vice
      # versa). Without this they live in separate cache buckets.
      - name: Cache cargo registry and target
        if: steps.bundle-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: omnibus

      - name: Bundle web app
        if: steps.bundle-cache.outputs.cache-hit != 'true'
        run: nix develop .#e2e --command bash -c 'set -euo pipefail; dx bundle --platform web --package omnibus --fullstack --release'

      # Explicit save (not the combined cache action's post-step) so it runs
      # while `target/dx/omnibus/release/web` still exists. See the restore step
      # above for the rust-cache cleanup race we're dodging.
      - name: Save dx bundle cache
        if: steps.bundle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/dx/omnibus/release/web
          key: ${{ steps.bundle-key.outputs.key }}

  playwright:
    name: playwright (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      CI: "1"
      CARGO_TARGET_DIR: ./target
      TOTAL_SHARDS: "2"
    steps:
      - uses: actions/checkout@v4

      # Public-domain fixtures aren't in git — they're the fixtures-vN
      # release asset. Cache them so shards/pushes don't re-download 156 MB;
      # the fetch script no-ops on a cache hit (marker + sentinel check).
      - name: Cache test fixtures
        uses: actions/cache@v4
        with:
          path: |
            test_data/epubs/public_domain
            test_data/audiobooks/public_domain
            test_data/.fixtures-version
          # Key on the fetch script's content: bumping the pinned sha256/URL
          # changes the hash, so a corrected tarball can't be shadowed by a
          # stale cache entry saved under a static key.
          key: fixtures-${{ hashFiles('scripts/fetch-fixtures.sh') }}

      - name: Fetch test fixtures
        run: scripts/fetch-fixtures.sh

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      # Distinct nix cache from `rust.yml`'s `nix-rust-` so the two workflows
      # don't clobber each other; shared across e2e jobs via the prefix.
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-e2e-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-e2e-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-e2e-${{ runner.os }}-
          purge-last-accessed: 604800
          purge-primary-key: never
          gc-max-store-size-linux: 5G

      - name: Cache Playwright node_modules
        uses: actions/cache@v4
        with:
          path: ui_tests/playwright/node_modules
          key: playwright-node-modules-${{ runner.os }}-${{ hashFiles('ui_tests/playwright/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-node-modules-${{ runner.os }}-

      # Re-use the bundle produced by the `bundle` job. The key is the same
      # one that job computed, so this is a guaranteed hit when `bundle`
      # succeeded.
      - name: Restore dx bundle cache
        uses: actions/cache@v4
        with:
          path: target/dx/omnibus/release/web
          key: ${{ needs.bundle.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Install Playwright npm deps
        run: nix develop .#e2e --command bash -c 'set -euo pipefail; cd ui_tests/playwright && pnpm install --frozen-lockfile'

      # Backgrounded with `nohup ... &` + `disown` so the server survives the
      # step's shell exit and the next step can poll it.
      - name: Start server
        run: |
          nix develop .#e2e --command bash -c '
            set -euo pipefail
            chmod +x ./target/dx/omnibus/release/web/server
            nohup env PORT=3000 ./target/dx/omnibus/release/web/server >server.log 2>&1 &
            disown
            pnpm dlx wait-on -t 60000 http://127.0.0.1:3000
          '

      - name: Run Playwright tests
        run: |
          nix develop .#e2e --command bash -c '
            set -euo pipefail
            cd ui_tests/playwright
            pnpm exec playwright test --shard=${{ matrix.shard }}/${{ env.TOTAL_SHARDS }} --reporter=list,blob
          '

      # Blob reports (one per shard, attachments embedded) are the input the
      # `publish-report` job stitches into a single hosted HTML report.
      # Uploaded on every run — pass and fail — so the Pages report always
      # reflects the latest run, not just failures.
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: ui_tests/playwright/blob-report
          retention-days: 7

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-shard-${{ matrix.shard }}
          path: server.log
          retention-days: 7

  # Merge the per-shard blob reports into one HTML report, then hand the merged
  # report to the `publish-playwright-report` composite action to publish to the
  # `gh-pages` branch (which GitHub Pages serves), so failures and passes are
  # inspectable at a URL without downloading an artifact. Merging lives here (not
  # in the action) so the action's sole job is publishing a ready report — no
  # Node/Playwright dependency. This job supplies the caller-level policy — run
  # whether or not the shards passed (but skip if a shard was cancelled or never
  # ran), and serialize gh-pages pushes.
  publish-report:
    name: publish report
    needs: playwright
    if: ${{ always() && needs.playwright.result != 'skipped' && needs.playwright.result != 'cancelled' }}
    runs-on: ubuntu-latest
    # `contents: write` to push the report to gh-pages; `actions: read` for
    # download-artifact@v4; `pull-requests: write` for the sticky report-URL
    # comment. Declaring `permissions` zeroes every unlisted scope, so all
    # three must be listed explicitly.
    permissions:
      contents: write
      actions: read
      pull-requests: write
    # Serialize gh-pages pushes across all runs: each publish fetches the live
    # branch, adds its folder, and pushes, so two in-flight jobs would race and
    # one push would reject. A single-slot group (no cancel) queues them.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      # Checkout so the local composite action is on disk and `pnpm install`
      # can find the Playwright project. This job runs on the runner's own
      # Node (not the Nix shell), so pnpm is provisioned via pnpm/action-setup
      # (reads the `packageManager` pin in ui_tests/playwright/package.json).
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui_tests/playwright/package.json

      # Node 22 (matches the flake's nodejs_22): the pinned pnpm 11.1.2
      # requires Node >= 22.13 and pulls in `node:sqlite`, so Node 20 crashes
      # with ERR_UNKNOWN_BUILTIN_MODULE before it can merge the reports.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge blob reports into one HTML report
        env:
          # merge-reports needs @playwright/test but no browser binaries; skip
          # the ~150 MB Chromium download the postinstall would otherwise run.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          cd ui_tests/playwright
          pnpm install --frozen-lockfile
          pnpm exec playwright merge-reports --reporter html "$GITHUB_WORKSPACE/all-blob-reports"

      - uses: ./.github/actions/publish-playwright-report
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pages-base-url: https://seamus-sloan.github.io/omnibus
          report-dir: ui_tests/playwright/playwright-report

  # The required status check for this workflow. Always runs (no paths filter +
  # `if: always()`), so branch protection gets a resolved status on every PR —
  # green when bundle + playwright passed or were skipped, red when either
  # failed. `publish-report` is intentionally NOT gated on: report publishing
  # failing must not block a merge. Mark ONLY `🔒 Playwright Required` as
  # required in branch protection; do not require `bundle` / the `playwright`
  # shards (they skip on non-E2E PRs and would hang the merge).
  playwright-required:
    name: 🔒 Playwright Required
    needs: [changes, bundle, playwright]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-gate
        with:
          needs: ${{ toJSON(needs) }}
