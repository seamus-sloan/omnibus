name: E2E

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    # Only run E2E when a PR touches code that can change the web bundle or
    # the test suite itself. This replaces the old `run_ui_tests` label
    # opt-in: matching PRs get Playwright coverage automatically. The trigger
    # set must stay in sync with the bundle cache key below — any input
    # hashed into the key needs a corresponding entry here, otherwise a PR
    # could change the bundle without ever invalidating its cache. To force
    # E2E on a PR that touches none of these paths, use the
    # `workflow_dispatch` escape hatch below.
    paths:
      - "frontend/**"
      - "shared/**"
      - "server/**"
      - "db/**"
      - "ui_tests/**"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "**/Dioxus.toml"
      - "flake.lock"
      - "flake.nix"
      - "scripts/fetch-fixtures.sh"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Compile the fullstack web bundle (native server binary + WASM client)
  # in release mode once and stash it in the GHA cache. Release mode strips
  # the Dioxus hot-reload client from the WASM bundle, which otherwise
  # injects a "Your app is being rebuilt" overlay that corrupts the DOM.
  # Cache key covers every input that can change compiled output: the
  # lockfile, per-crate manifests, the workspace crates that feed the web
  # build, the Dioxus bundle config, the flake (toolchain pin), and this
  # workflow file. Keep the `paths:` trigger above in sync.
  bundle:
    name: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      CARGO_TARGET_DIR: ./target
    outputs:
      cache-key: ${{ steps.bundle-key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute bundle cache key
        id: bundle-key
        run: |
          key="dx-bundle-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '**/Dioxus.toml', 'flake.lock', 'flake.nix', 'frontend/**', 'shared/**', 'server/**', 'db/**', '.github/workflows/e2e.yml') }}"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # Split restore + save so the save happens as a normal step right after
      # the bundle, BEFORE `Swatinem/rust-cache`'s post-step cleans `target/`.
      # If we used `actions/cache@v4` (combined), its post-step would run
      # AFTER rust-cache's cleanup — GHA runs post-steps in reverse
      # declaration order — and find an empty path. (We learned that the
      # hard way; see https://github.com/seamus-sloan/omnibus/pull/319.)
      - name: Restore dx bundle cache
        id: bundle-cache
        uses: actions/cache/restore@v4
        with:
          path: target/dx/omnibus/release/web
          key: ${{ steps.bundle-key.outputs.key }}

      - name: Install Nix
        if: steps.bundle-cache.outputs.cache-hit != 'true'
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Cache Nix store
        if: steps.bundle-cache.outputs.cache-hit != 'true'
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-e2e-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-e2e-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-e2e-${{ runner.os }}-
          purge-last-accessed: 604800
          purge-primary-key: never
          gc-max-store-size-linux: 5G

      # Same `shared-key` as rust.yml so a warm `cargo` target dir from the
      # Rust workflow primes the native half of `dx bundle` here (and vice
      # versa). Without this they live in separate cache buckets.
      - name: Cache cargo registry and target
        if: steps.bundle-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: omnibus

      - name: Bundle web app
        if: steps.bundle-cache.outputs.cache-hit != 'true'
        run: nix develop .#e2e --command bash -c 'set -euo pipefail; dx bundle --platform web --package omnibus --fullstack --release'

      # Explicit save (not the combined cache action's post-step) so it runs
      # while `target/dx/omnibus/release/web` still exists. See the restore step
      # above for the rust-cache cleanup race we're dodging.
      - name: Save dx bundle cache
        if: steps.bundle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/dx/omnibus/release/web
          key: ${{ steps.bundle-key.outputs.key }}

  playwright:
    name: playwright (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      CI: "1"
      CARGO_TARGET_DIR: ./target
      TOTAL_SHARDS: "2"
    steps:
      - uses: actions/checkout@v4

      # Public-domain fixtures aren't in git — they're the fixtures-vN
      # release asset. Cache them so shards/pushes don't re-download 156 MB;
      # the fetch script no-ops on a cache hit (marker + sentinel check).
      - name: Cache test fixtures
        uses: actions/cache@v4
        with:
          path: |
            test_data/epubs/public_domain
            test_data/audiobooks/public_domain
            test_data/.fixtures-version
          # Key on the fetch script's content: bumping the pinned sha256/URL
          # changes the hash, so a corrected tarball can't be shadowed by a
          # stale cache entry saved under a static key.
          key: fixtures-${{ hashFiles('scripts/fetch-fixtures.sh') }}

      - name: Fetch test fixtures
        run: scripts/fetch-fixtures.sh

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      # Distinct nix cache from `rust.yml`'s `nix-rust-` so the two workflows
      # don't clobber each other; shared across e2e jobs via the prefix.
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-e2e-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-e2e-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-e2e-${{ runner.os }}-
          purge-last-accessed: 604800
          purge-primary-key: never
          gc-max-store-size-linux: 5G

      - name: Cache Playwright node_modules
        uses: actions/cache@v4
        with:
          path: ui_tests/playwright/node_modules
          key: playwright-node-modules-${{ runner.os }}-${{ hashFiles('ui_tests/playwright/package-lock.json') }}
          restore-keys: |
            playwright-node-modules-${{ runner.os }}-

      # Re-use the bundle produced by the `bundle` job. The key is the same
      # one that job computed, so this is a guaranteed hit when `bundle`
      # succeeded.
      - name: Restore dx bundle cache
        uses: actions/cache@v4
        with:
          path: target/dx/omnibus/release/web
          key: ${{ needs.bundle.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Install Playwright npm deps
        run: nix develop .#e2e --command bash -c 'set -euo pipefail; cd ui_tests/playwright && npm ci'

      # Backgrounded with `nohup ... &` + `disown` so the server survives the
      # step's shell exit and the next step can poll it.
      - name: Start server
        run: |
          nix develop .#e2e --command bash -c '
            set -euo pipefail
            chmod +x ./target/dx/omnibus/release/web/server
            nohup env PORT=3000 ./target/dx/omnibus/release/web/server >server.log 2>&1 &
            disown
            npx --yes wait-on -t 60000 http://127.0.0.1:3000
          '

      - name: Run Playwright tests
        run: |
          nix develop .#e2e --command bash -c '
            set -euo pipefail
            cd ui_tests/playwright
            npx playwright test --shard=${{ matrix.shard }}/${{ env.TOTAL_SHARDS }} --reporter=list,blob
          '

      # Blob reports (one per shard, attachments embedded) are the input the
      # `publish-report` job stitches into a single hosted HTML report.
      # Uploaded on every run — pass and fail — so the Pages report always
      # reflects the latest run, not just failures.
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: ui_tests/playwright/blob-report
          retention-days: 7

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-shard-${{ matrix.shard }}
          path: server.log
          retention-days: 7

  # Stitch the per-shard blob reports into one browsable HTML report and
  # publish it to the `gh-pages` branch (which GitHub Pages serves), so
  # failures and passes are inspectable at a URL without downloading an
  # artifact and running `npx playwright show-report` locally. Runs whether or
  # not the shards passed (but skips if a shard was cancelled or never ran).
  # `merge-reports` needs @playwright/test but no browser, so this job stays on
  # plain setup-node — no Nix.
  #
  # Each run adds a NEW `<branch>/<sha>/test-results/` directory and preserves
  # every prior one (we fetch the live gh-pages tree and only replace this
  # run's own folder), so historical reports stay addressable. The root
  # `index.html` redirect is rewritten only on `main` deploys, so `/` always
  # points at the latest `main` report (the stable target the README badge
  # links to); feature-branch reports are reachable at their own URL but never
  # hijack the root.
  publish-report:
    name: publish report
    needs: playwright
    if: ${{ always() && needs.playwright.result != 'skipped' && needs.playwright.result != 'cancelled' }}
    runs-on: ubuntu-latest
    # `contents: write` to push the report to gh-pages; `actions: read` for
    # download-artifact@v4. Declaring `permissions` zeroes every unlisted
    # scope, so both must be listed explicitly.
    permissions:
      contents: write
      actions: read
    # Serialize gh-pages pushes across all runs: each publish fetches the live
    # branch, adds its folder, and pushes, so two in-flight jobs would race and
    # one push would reject. A single-slot group (no cancel) queues them.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge blob reports into one HTML report
        env:
          # merge-reports needs @playwright/test but no browser binaries;
          # skip the ~150 MB Chromium download the postinstall would run.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          cd ui_tests/playwright
          npm ci
          npx playwright merge-reports --reporter html ../../all-blob-reports

      # Publish into gh-pages at <branch>/<sha>/test-results/, preserving every
      # other report already there, and point the root redirect at this one.
      - name: Publish report to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # head_ref is set on pull_request events (the PR branch); ref_name is
          # the branch on push events. head.sha is the PR's real head; on push,
          # github.sha is the pushed commit (not a synthetic merge commit).
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          DEST="${BRANCH_NAME}/${COMMIT_SHA}/test-results"
          AUTH_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          # Clone the existing gh-pages tree; create an orphan branch if it's
          # the first run and the branch doesn't exist yet.
          if git clone --depth 1 --branch gh-pages "$AUTH_URL" gh-pages 2>/dev/null; then
            cd gh-pages
          else
            git clone --depth 1 "$AUTH_URL" gh-pages
            cd gh-pages
            git checkout --orphan gh-pages
            git rm -rfq . || true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Replace only this run's folder; leave all other reports intact.
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "${GITHUB_WORKSPACE}/ui_tests/playwright/playwright-report/." "$DEST/"

          # Write a meta-refresh redirect page. $1 = relative target URL,
          # $2 = output file. Relative URLs so they work under the /omnibus/
          # project-pages base path.
          write_redirect() {
            printf '<!doctype html>\n<meta charset="utf-8">\n<meta http-equiv="refresh" content="0; url=%s">\n<title>Omnibus — Playwright report</title>\n<a href="%s">Latest Playwright report →</a>\n' "$1" "$1" > "$2"
          }

          # Per-branch pointer: /omnibus/<branch>/ → this branch's newest report.
          # Updated every run, so a branch's latest report is reachable without
          # knowing the sha.
          write_redirect "./${COMMIT_SHA}/test-results/" "${BRANCH_NAME}/index.html"

          # Root pointer, main only: /omnibus/ → latest main report. PR runs
          # never touch it, so the README badge stays pinned to main.
          if [ "$BRANCH_NAME" = "main" ]; then
            write_redirect "./${DEST}/" "index.html"
          fi

          # Serve the report assets verbatim (no Jekyll processing of _ paths).
          touch .nojekyll

          # Link both URLs from the run's summary so the report is one click from
          # the Actions page — no sha-hunting.
          {
            echo "### 📊 Playwright report"
            echo ""
            echo "- **This run:** https://seamus-sloan.github.io/omnibus/${DEST}/"
            echo "- **Latest for \`${BRANCH_NAME}\`:** https://seamus-sloan.github.io/omnibus/${BRANCH_NAME}/"
          } >> "$GITHUB_STEP_SUMMARY"

          git add -A
          git commit -q -m "test report: ${BRANCH_NAME}@${COMMIT_SHA:0:9}" || { echo "no changes to publish"; exit 0; }
          git push "$AUTH_URL" HEAD:gh-pages
