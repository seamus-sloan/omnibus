name: Rust

on:
  # No workflow-level `paths:` filter: this workflow must run on EVERY PR so
  # its `rust-required` gate always reports a status. A required check keyed on
  # a path-filtered workflow never resolves on a PR that doesn't touch the
  # paths, blocking the merge forever. Path gating moved into the `changes`
  # job below; the real jobs skip when no Rust input changed, and the gate
  # treats skipped as pass.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Detect whether this PR touches anything the Rust jobs care about. On push
  # (and any non-PR event) the real jobs run unconditionally, so this output is
  # only consulted for pull_request events.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Keep in sync with the old workflow-level `paths:` list.
          filters: |
            rust:
              - "**/*.rs"
              - "**/Cargo.toml"
              - "Cargo.lock"
              - "flake.nix"
              - "flake.lock"
              - "rust-toolchain*"
              - ".github/workflows/rust.yml"
              - ".github/actions/ci-gate/action.yml"
              - "deny.toml"

  fmt:
    name: rustfmt
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all --check

  # `clippy` and `test` fan out into independent matrix jobs with no serial
  # prepass: each variant restores the cargo cache and compiles its own
  # dependency + workspace closure, so all three distinct closures — native
  # (default shell), wasm32 (web feature), and the GTK/wry mobile backend
  # (`.#mobile`) — compile in parallel instead of back-to-back. There is no
  # "build once" job; deps recompile across variants on a cold cache, but the
  # shared caches below make steady-state runs cheap and nothing waits on a
  # blocking prepass.
  #
  # Cache buckets (Swatinem/rust-cache `shared-key`; GHA keys are write-once
  # per lockfile, so the first variant in a bucket populates it and the rest
  # restore it):
  #   - `omnibus`        — native host closure, shared with e2e.yml's bundle job
  #   - `omnibus-wasm`   — wasm32 closure (only `clippy (frontend-web)`)
  #   - `omnibus-mobile` — GTK/wry closure (only `clippy (mobile)`), kept
  #                        separate so mobile-only artifacts don't bloat the hot
  #                        `omnibus` restore that every native variant pays.
  clippy:
    name: clippy (${{ matrix.name }})
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: write
    env:
      CARGO_TARGET_DIR: ./target
    strategy:
      # One failing variant shouldn't cancel the others — we want every lint
      # result on the PR, not just the first failure.
      fail-fast: false
      matrix:
        include:
          - name: server
            cmd: cargo clippy -p omnibus --all-targets -- -D warnings
          - name: db
            cmd: cargo clippy -p omnibus-db --all-targets -- -D warnings
          - name: frontend
            cmd: cargo clippy -p omnibus-frontend --features server --all-targets -- -D warnings
          # Lint the `web` feature on wasm32 so web-only (`#[cfg(feature = "web")]`)
          # deprecations/warnings are caught — the `server` variant never sees them.
          # Its own cache bucket — the wasm32 closure is disjoint from native.
          - name: frontend-web
            cache_key: omnibus-wasm
            cmd: cargo clippy -p omnibus-frontend --features web --all-targets --target wasm32-unknown-unknown -- -D warnings
          # Same cfg-split mobile code path the `test` matrix covers. Only needs
          # reqwest/tokio (no GTK/wry — that's `omnibus-mobile`), so it runs in
          # the default shell like the other frontend variants.
          - name: frontend-mobile
            cmd: cargo clippy -p omnibus-frontend --features mobile --all-targets -- -D warnings
          - name: shared
            cmd: cargo clippy -p omnibus-shared --all-targets -- -D warnings
          # `omnibus-mobile` is excluded from `default-members` (its `mobile`
          # feature on `omnibus-frontend` is mutually exclusive with `web`), so
          # bare clippy skips it. Target it explicitly, host target only — the
          # iOS/Android cross toolchains aren't on ubuntu-latest. Runs in the
          # `.#mobile` shell for the GTK 3 + WebKitGTK libs the wry backend needs.
          # Own cache bucket so the heavy GTK/wry closure stays out of `omnibus`.
          - name: mobile
            shell: .#mobile
            cache_key: omnibus-mobile
            cmd: cargo clippy -p omnibus-mobile --all-targets -- -D warnings
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-rust-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-rust-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-rust-${{ runner.os }}-
          purge-last-accessed: 604800
          purge-primary-key: never
          gc-max-store-size-linux: 5G

      # Per-variant bucket (defaults to `omnibus`). First variant in the bucket
      # populates it; the rest restore. GHA cache keys are write-once per
      # lockfile, so concurrent saves on a cold cache dedupe to a single write.
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: ${{ matrix.cache_key || 'omnibus' }}

      - name: Clippy
        run: nix develop ${{ matrix.shell }} --command ${{ matrix.cmd }}

  test:
    name: test (${{ matrix.name }})
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: write
    env:
      CARGO_TARGET_DIR: ./target
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            cmd: cargo test -p omnibus
          # `cargo test -p omnibus-db` needs the public-domain fixtures (the
          # public_domain_epubs regression suite + audiobook cover tests); no
          # other variant does, so only this one fetches them.
          - name: db
            fixtures: true
            cmd: cargo test -p omnibus-db
          - name: frontend
            cmd: cargo test -p omnibus-frontend --features server
          # `--features mobile` exercises a distinct cfg-split path from
          # `server` (`data::token_store` / `app_dirs` native token
          # persistence). Only needs reqwest/tokio (no GTK/wry), so it runs in
          # the default shell rather than `.#mobile`.
          - name: frontend-mobile
            cmd: cargo test -p omnibus-frontend --features mobile
          - name: shared
            cmd: cargo test -p omnibus-shared
    steps:
      - uses: actions/checkout@v4

      # Public-domain fixtures aren't in git — they're the fixtures-vN release
      # asset. Only the `db` variant needs them.
      - name: Cache test fixtures
        if: matrix.fixtures
        uses: actions/cache@v4
        with:
          path: |
            test_data/epubs/public_domain
            test_data/audiobooks/public_domain
            test_data/.fixtures-version
          # Key on the fetch script's content: bumping the pinned sha256/URL
          # changes the hash, so a corrected tarball can't be shadowed by a
          # stale cache entry saved under a static key.
          key: fixtures-${{ hashFiles('scripts/fetch-fixtures.sh') }}

      - name: Fetch test fixtures
        if: matrix.fixtures
        run: scripts/fetch-fixtures.sh

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-rust-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-rust-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-rust-${{ runner.os }}-
          purge-last-accessed: 604800
          purge-primary-key: never
          gc-max-store-size-linux: 5G

      # All test variants build native crates, so they share the `omnibus`
      # bucket (also shared with clippy's native variants and e2e.yml's bundle).
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: omnibus

      - name: Test
        run: nix develop --command ${{ matrix.cmd }}

  security:
    name: cargo audit
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by DeterminateSystems/nix-installer-action so GitHub Actions
      # provides the OIDC token endpoints it needs to authenticate to FlakeHub.
      # Without it the installer falls back to anonymous api.github.com fetches
      # that intermittently 401 ("Bad credentials") during flake evaluation.
      id-token: write
      # Required by nix-community/cache-nix-action `purge: true` so it can
      # delete its own expired cache entries via the Actions cache API.
      actions: write
      # Required to post / update the sticky audit-report comment on PRs.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      # Cache the Nix store across runs. Auto-purges caches with the same
      # prefix that haven't been touched in 7 days so we stay under the 10 GB
      # per-repo GHA cache quota. Distinct prefix from the `check` job so the
      # two jobs don't clobber each other's cache entries.
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-audit-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-audit-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-audit-${{ runner.os }}-
          purge-last-accessed: 604800
          purge-primary-key: never
          gc-max-store-size-linux: 5G

      # Run cargo-audit in JSON mode for downstream parsing. `set +e` captures
      # the exit code without failing this step, so the report/comment steps
      # below still run on an advisory; the dedicated "Fail on advisories" gate
      # at the end re-raises this exit code so CI blocks on unfixed advisories.
      # To accept a specific advisory (e.g. disputed or
      # only-affects-unused-feature), add `--ignore RUSTSEC-XXXX-YYYY` below
      # with a comment explaining the rationale (keep in sync with deny.toml).
      #
      # Ignored advisories:
      #   RUSTSEC-2023-0071 (rsa "Marvin Attack") — `rsa` is pulled into
      #   Cargo.lock only by `sqlx-mysql`. We use sqlx with the sqlite backend
      #   only, so `rsa` is never compiled into any target (`cargo tree -i rsa
      #   --target all` is empty). No fixed `rsa` release exists yet; revisit
      #   when one does. Lock-file-only, not reachable — not exploitable here.
      - name: cargo audit
        id: audit
        run: |
          set +e
          # Redirect inside the nix-develop subshell so the shellHook's
          # informational echoes (`Nix dev shell ready.`, etc.) don't get
          # mixed into the JSON capture file.
          nix develop .#audit --command bash -c 'cargo audit --json --ignore RUSTSEC-2023-0071 > audit.json'
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          # Deliberately succeed here so the report + sticky-comment steps run
          # even when an advisory is present; the gate step below re-raises it.
          exit 0

      # Build a human-readable markdown report from the JSON output. If
      # `audit.json` is missing or not valid JSON (cargo-audit itself failed,
      # e.g. couldn't fetch the advisory DB), report that as a failure case
      # rather than silently claiming "no advisories found".
      - name: Format audit report
        id: report
        if: always()
        run: |
          set -euo pipefail
          # `jq` is part of the standard ubuntu-latest image.
          {
            echo "<!-- cargo-audit-report -->"
            echo "## cargo-audit"
            echo
            if [ ! -s audit.json ] || ! jq -e . audit.json >/dev/null 2>&1; then
              echo "⚠️ cargo-audit did not produce a valid JSON report (exit code \`${{ steps.audit.outputs.exit_code }}\`). See the \`security\` job log for details."
              count="error"
            else
              count=$(jq '.vulnerabilities.count // 0' audit.json)
              if [ "$count" = "0" ]; then
                echo "No RustSec advisories found in \`Cargo.lock\` ✅"
              else
                echo "Found **$count** advisory/advisories in \`Cargo.lock\`:"
                echo
                jq -r '
                  .vulnerabilities.list[] |
                  "- **\(.advisory.id)** — `\(.package.name) \(.package.version)`: \(.advisory.title)\n  <\(.advisory.url // "https://rustsec.org/advisories/\(.advisory.id)")>"
                ' audit.json
                echo
                echo "Run \`cargo audit\` locally for full detail."
              fi
            fi
            echo
            echo "<sub>Posted by the Rust workflow's \`security\` job.</sub>"
          } > audit-report.md
          echo "count=$count" >> "$GITHUB_OUTPUT"

      # Find-or-create a single sticky comment per PR keyed on the
      # `<!-- cargo-audit-report -->` marker, so re-runs update the same
      # comment instead of stacking new ones. Only runs on pull_request
      # events — pushes to `main` skip this and just leave the artifact.
      - name: Post / update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: cargo-audit-report
          path: audit-report.md

      - name: Upload audit JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-json
          path: audit.json
          retention-days: 14

      # Re-raise the captured cargo-audit exit code so the job fails on unfixed
      # advisories. Kept separate from the audit step so the report + sticky
      # PR comment above always run first (they lack a hard dependency on this
      # gate's success).
      - name: Fail on advisories
        if: always()
        run: |
          code="${{ steps.audit.outputs.exit_code }}"
          if [ "$code" != "0" ]; then
            echo "cargo audit reported advisories (exit code $code); failing the job." >&2
            exit "$code"
          fi

      # cargo deny adds coverage cargo-audit lacks: advisories against the ~31
      # git-pinned Dioxus crates, source allow-listing, duplicate-version bans,
      # and license-allowlist enforcement. deny.toml in the repo root is the
      # config.
      #
      # All four checks are hard gates: a violation in advisories, sources,
      # bans, or licenses fails the job. If a policy needs to relax (e.g. a new
      # git-pinned source appears for a Dioxus crate, or a transitive dep
      # introduces a license not yet on the allowlist), update deny.toml's
      # `[sources.allow-git]`, `[licenses].allow`, or the relevant
      # `ignore`/`skip` list rather than re-introducing `continue-on-error: true`.
      - name: cargo deny check
        run: nix develop .#audit --command cargo deny check advisories sources bans licenses

  # Required status checks for this workflow — one per concern. Each always
  # runs (its `if` is `always()` and the workflow has no paths filter), so
  # branch protection gets a resolved status on every PR: green when its
  # underlying job(s) passed or were skipped, red when any failed. Mark ONLY
  # these gate jobs as required in branch protection — `Rustfmt Required`,
  # `Clippy Required`, `Cargo Test Required`, `Cargo Audit Required` — and do
  # NOT require the individual matrix jobs (they skip on non-Rust PRs and would
  # hang the merge).
  rustfmt-required:
    name: Rustfmt Required
    needs: [changes, fmt]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-gate
        with:
          needs: ${{ toJSON(needs) }}

  clippy-required:
    name: Clippy Required
    needs: [changes, clippy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-gate
        with:
          needs: ${{ toJSON(needs) }}

  cargo-test-required:
    name: Cargo Test Required
    needs: [changes, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-gate
        with:
          needs: ${{ toJSON(needs) }}

  cargo-audit-required:
    name: Cargo Audit Required
    needs: [changes, security]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-gate
        with:
          needs: ${{ toJSON(needs) }}
