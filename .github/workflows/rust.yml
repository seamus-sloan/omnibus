name: Rust

on:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "flake.nix"
      - "flake.lock"
      - "rust-toolchain*"
      - ".github/workflows/rust.yml"
      - "deny.toml"
  push:
    branches: [main]

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all --check

  check:
    name: clippy + test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by DeterminateSystems/nix-installer-action so GitHub Actions
      # provides the OIDC token endpoints it needs to authenticate to FlakeHub.
      # Without it the installer falls back to anonymous api.github.com fetches
      # that intermittently 401 ("Bad credentials") during flake evaluation.
      id-token: write
      # Required by nix-community/cache-nix-action `purge: true` so it can
      # delete its own expired cache entries via the Actions cache API.
      actions: write
    env:
      # Match e2e.yml: pin target dir so rust-cache (keyed on `. -> target`)
      # actually caches anything across runs.
      CARGO_TARGET_DIR: ./target
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      # Cache the Nix store across runs. Auto-purges caches with the same
      # prefix that haven't been touched in 7 days so we stay under the 10 GB
      # per-repo GHA cache quota. Replaces DeterminateSystems/magic-nix-cache-action
      # (sunset; was uploading unbounded and exceeding the quota).
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-rust-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-rust-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-rust-${{ runner.os }}-
          purge-last-accessed: 604800
          purge-primary-key: never
          gc-max-store-size-linux: 5G

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: cargo clippy (server)
        run: nix develop --command cargo clippy -p omnibus --all-targets -- -D warnings

      - name: cargo clippy (db)
        run: nix develop --command cargo clippy -p omnibus-db --all-targets -- -D warnings

      - name: Clippy frontend
        run: nix develop --command cargo clippy -p omnibus-frontend --features server --all-targets -- -D warnings

      - name: Clippy shared
        run: nix develop --command cargo clippy -p omnibus-shared --all-targets -- -D warnings

      - name: cargo test (server)
        run: nix develop --command cargo test -p omnibus

      - name: cargo test (db)
        run: nix develop --command cargo test -p omnibus-db

      - name: cargo test (frontend)
        run: nix develop --command cargo test -p omnibus-frontend --features server

  security:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by DeterminateSystems/nix-installer-action so GitHub Actions
      # provides the OIDC token endpoints it needs to authenticate to FlakeHub.
      # Without it the installer falls back to anonymous api.github.com fetches
      # that intermittently 401 ("Bad credentials") during flake evaluation.
      id-token: write
      # Required by nix-community/cache-nix-action `purge: true` so it can
      # delete its own expired cache entries via the Actions cache API.
      actions: write
      # Required to post / update the sticky audit-report comment on PRs.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      # Cache the Nix store across runs. Auto-purges caches with the same
      # prefix that haven't been touched in 7 days so we stay under the 10 GB
      # per-repo GHA cache quota. Distinct prefix from the `check` job so the
      # two jobs don't clobber each other's cache entries.
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-audit-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-audit-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-audit-${{ runner.os }}-
          purge-last-accessed: 604800
          purge-primary-key: never
          gc-max-store-size-linux: 5G

      # Run cargo-audit in JSON mode for downstream parsing. `set +e` captures
      # the exit code without failing this step, so the report/comment steps
      # below still run on an advisory; the dedicated "Fail on advisories" gate
      # at the end re-raises this exit code so CI blocks on unfixed advisories.
      # To accept a specific advisory (e.g. disputed or
      # only-affects-unused-feature), add `--ignore RUSTSEC-XXXX-YYYY` below
      # with a comment explaining the rationale (keep in sync with deny.toml).
      #
      # Ignored advisories:
      #   RUSTSEC-2023-0071 (rsa "Marvin Attack") — `rsa` is pulled into
      #   Cargo.lock only by `sqlx-mysql`. We use sqlx with the sqlite backend
      #   only, so `rsa` is never compiled into any target (`cargo tree -i rsa
      #   --target all` is empty). No fixed `rsa` release exists yet; revisit
      #   when one does. Lock-file-only, not reachable — not exploitable here.
      - name: cargo audit
        id: audit
        run: |
          set +e
          # Redirect inside the nix-develop subshell so the shellHook's
          # informational echoes (`Nix dev shell ready.`, etc.) don't get
          # mixed into the JSON capture file.
          nix develop --command bash -c 'cargo audit --json --ignore RUSTSEC-2023-0071 > audit.json'
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          # Deliberately succeed here so the report + sticky-comment steps run
          # even when an advisory is present; the gate step below re-raises it.
          exit 0

      # Build a human-readable markdown report from the JSON output. If
      # `audit.json` is missing or not valid JSON (cargo-audit itself failed,
      # e.g. couldn't fetch the advisory DB), report that as a failure case
      # rather than silently claiming "no advisories found".
      - name: Format audit report
        id: report
        if: always()
        run: |
          set -euo pipefail
          # `jq` is part of the standard ubuntu-latest image.
          {
            echo "<!-- cargo-audit-report -->"
            echo "## cargo-audit"
            echo
            if [ ! -s audit.json ] || ! jq -e . audit.json >/dev/null 2>&1; then
              echo "⚠️ cargo-audit did not produce a valid JSON report (exit code \`${{ steps.audit.outputs.exit_code }}\`). See the \`security\` job log for details."
              count="error"
            else
              count=$(jq '.vulnerabilities.count // 0' audit.json)
              if [ "$count" = "0" ]; then
                echo "No RustSec advisories found in \`Cargo.lock\` ✅"
              else
                echo "Found **$count** advisory/advisories in \`Cargo.lock\`:"
                echo
                jq -r '
                  .vulnerabilities.list[] |
                  "- **\(.advisory.id)** — `\(.package.name) \(.package.version)`: \(.advisory.title)\n  <\(.advisory.url // "https://rustsec.org/advisories/\(.advisory.id)")>"
                ' audit.json
                echo
                echo "Run \`cargo audit\` locally for full detail."
              fi
            fi
            echo
            echo "<sub>Posted by the Rust workflow's \`security\` job.</sub>"
          } > audit-report.md
          echo "count=$count" >> "$GITHUB_OUTPUT"

      # Find-or-create a single sticky comment per PR keyed on the
      # `<!-- cargo-audit-report -->` marker, so re-runs update the same
      # comment instead of stacking new ones. Only runs on pull_request
      # events — pushes to `main` skip this and just leave the artifact.
      - name: Post / update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: cargo-audit-report
          path: audit-report.md

      - name: Upload audit JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-json
          path: audit.json
          retention-days: 14

      # Re-raise the captured cargo-audit exit code so the job fails on unfixed
      # advisories. Kept separate from the audit step so the report + sticky
      # PR comment above always run first (they lack a hard dependency on this
      # gate's success).
      - name: Fail on advisories
        if: always()
        run: |
          code="${{ steps.audit.outputs.exit_code }}"
          if [ "$code" != "0" ]; then
            echo "cargo audit reported advisories (exit code $code); failing the job." >&2
            exit "$code"
          fi

      # cargo deny adds coverage cargo-audit lacks: advisories against the ~31
      # git-pinned Dioxus crates, source allow-listing, and duplicate-version
      # bans. deny.toml in the repo root is the config.
      #
      # Scoped to `advisories sources bans` for now — the `licenses` check is
      # intentionally NOT run here yet: the workspace member crates carry no
      # `license` field (they're unpublished), which cargo-deny reports as
      # "unlicensed", and the full transitive license set hasn't been validated
      # against deny.toml's allow-list locally. The [licenses] config is left in
      # deny.toml so enabling it is a one-line follow-up once verified.
      #
      # Now a hard gate: a violation in advisories, sources, or bans fails the
      # job. If a deny.toml policy needs to relax (e.g. a new git-pinned source
      # appears for a Dioxus crate), update deny.toml's `[sources.allow-git]`
      # or the relevant `ignore`/`skip` list rather than re-introducing
      # `continue-on-error: true`.
      - name: cargo deny check
        run: nix develop --command cargo deny check advisories sources bans
