# Opens a GitHub issue for each new TestFlight screenshot feedback submission.
#
# Runs once a day (and on demand). Reuses the App Store Connect API key already
# configured for the build-upload workflow (testflight.yml) — no new secrets:
#   ASC_API_KEY_BASE64, ASC_KEY_ID, ASC_ISSUER_ID
#
# Screenshots are committed to the `testflight-feedback` branch so they render
# inline in issues and survive App Store Connect's short-lived image URLs.
# See scripts/testflight_feedback_to_issues.py for the logic and env contract.
name: TestFlight feedback → issues

on:
  schedule:
    - cron: "0 9 * * *" # daily at 09:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print instead of creating issues/assets"
        type: boolean
        default: false

# Serialize so two runs never file the same feedback twice.
concurrency:
  group: testflight-feedback
  cancel-in-progress: false

permissions:
  issues: write # create feedback issues
  contents: write # push screenshot assets to the testflight-feedback branch

jobs:
  feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install --quiet "pyjwt[crypto]" requests

      - name: Fetch feedback and open issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          BUNDLE_ID: com.omnibus.mobile
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python scripts/testflight_feedback_to_issues.py
