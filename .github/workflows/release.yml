name: Release

on:
  pull_request_target:
    types: [closed]

# Serialize on the base branch so runs queue and compute tags sequentially.
# A per-PR group would let two labeled PRs merging together read the same
# latest release and race to the same tag; the loser would silently skip.
concurrency:
  group: release-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # Needed to dispatch the Docker workflow after the release is created.
  actions: write
  # Needed to list the merged PR's changed files for the docs/CI skip check.
  pull-requests: read

jobs:
  create-release:
    name: create release
    # Every merge to main cuts a release: unlabeled merges default to a patch
    # bump; the 'minor version' label opts into a minor bump instead.
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        with:
          # Compute the next tag and create the release in one retry loop.
          # The base-branch concurrency group serializes runs, but a burst of
          # merges can still make GitHub cancel intermediate pending runs; if a
          # computed tag already exists we re-read the latest release and bump
          # again rather than silently skipping, so no version is ever dropped.
          script: |
            const labels = context.payload.pull_request.labels.map(({ name }) => name);
            const hasMinor = labels.includes("minor version");
            const hasPatch = labels.includes("patch version");

            // Explicit opt-out wins over everything.
            if (labels.includes("no release")) {
              core.info("PR is labeled 'no release'; skipping release.");
              return;
            }

            // Unlabeled merges default to a release, but docs-only / CI-only
            // changes don't warrant a version bump. An explicit version label
            // overrides this (the author opted in).
            if (!hasMinor && !hasPatch) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
              });
              const onlyDocsOrCi =
                files.length > 0 &&
                files.every(({ filename }) =>
                  filename.endsWith(".md") ||
                  filename.startsWith("docs/") ||
                  filename.startsWith(".github/"),
                );
              if (onlyDocsOrCi) {
                core.info(
                  "PR only touches docs/CI and has no version label; skipping release.",
                );
                return;
              }
            }

            // 'minor version' opts into a minor bump and wins if both labels are
            // present; every other case (patch label, or no label at all) is a
            // patch bump.
            const label = hasMinor ? "minor version" : "patch version";
            const target = process.env.TARGET_SHA;
            const maxAttempts = 5;

            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              let latestRelease;
              try {
                const response = await github.rest.repos.getLatestRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                });
                latestRelease = response.data;
              } catch (error) {
                if (error.status === 404) {
                  core.setFailed(
                    "No published release exists yet. Create the initial major release manually before using version labels.",
                  );
                  return;
                }
                throw error;
              }

              const match = /^v(\d+)\.(\d+)\.(\d+)$/.exec(latestRelease.tag_name);
              if (!match) {
                core.setFailed(
                  `Latest release tag '${latestRelease.tag_name}' is not in vMAJOR.MINOR.PATCH format.`,
                );
                return;
              }

              const major = Number(match[1]);
              let minor = Number(match[2]);
              let patch = Number(match[3]);

              if (hasMinor) {
                minor += 1;
                patch = 0;
              } else {
                patch += 1;
              }

              const tag = `v${major}.${minor}.${patch}`;

              try {
                await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  target_commitish: target,
                  name: tag,
                  generate_release_notes: true,
                  body: `Automated ${label} release from #${context.payload.pull_request.number}.`,
                });
                core.info(`Created release ${tag}.`);

                // A release created with GITHUB_TOKEN can't fire the Docker
                // workflow's `release: published` trigger (GitHub blocks
                // token-triggered workflow chaining), so dispatch it directly.
                // workflow_dispatch is exempt from that block.
                try {
                  await github.rest.actions.createWorkflowDispatch({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: "docker.yml",
                    ref: context.payload.pull_request.base.ref,
                    inputs: { tag },
                  });
                  core.info(`Dispatched Docker build for ${tag}.`);
                } catch (error) {
                  core.setFailed(
                    `Release ${tag} was created but dispatching the Docker build failed: ${error.message || String(error)}. ` +
                      `Re-run the Docker workflow manually with tag ${tag}.`,
                  );
                }
                return;
              } catch (error) {
                // 422 = tag/release already exists: another run won the race.
                // Re-read the latest release and bump again from it.
                const alreadyExists =
                  error.status === 422 &&
                  (error.response?.data?.errors || []).some(
                    (e) => e.code === "already_exists",
                  );
                if (alreadyExists && attempt < maxAttempts) {
                  core.info(`Tag ${tag} already exists; recomputing (attempt ${attempt}).`);
                  continue;
                }
                throw error;
              }
            }

            core.setFailed(
              `Could not create a release after ${maxAttempts} attempts due to repeated tag collisions.`,
            );
