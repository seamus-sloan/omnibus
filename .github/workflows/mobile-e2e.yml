name: Mobile E2E

# Maestro flows (ui_tests/maestro) against the mobile app — the same YAML suite
# drives iOS and Android.
#
# - The iOS job gates the PR/push path (#1034). `server/**` + `db/**` are in
#   the `changes` filter because the job boots the real native server and the
#   flows probe `GET /api/_health` — a server or boot regression can fail
#   these runs even when nothing mobile changed.
# - The Android job is manual-only behind the `android` dispatch input until
#   its flows are green on the emulator (#1035).
# - The `stress` dispatch input fans the iOS job into N identical matrix
#   instances (e.g. `[1,2,3,4,5]`) to smoke out flakiness — every instance
#   must pass. Warm the caches with a normal run first so the stress
#   instances measure the suite, not a cold rebuild.
on:
  push:
    branches: [main]
  # No workflow-level `paths:` filter: this workflow must run on EVERY PR so
  # its `🔒 Mobile E2E Required` gate always reports a status (a required
  # check keyed on a path-filtered workflow never resolves on a PR that
  # doesn't match, which blocks the merge forever — see `rust.yml`/`e2e.yml`
  # for the same fix). Path gating moved into the `changes` job below;
  # `maestro-ios` skips when nothing mobile-relevant changed, and the gate
  # treats skipped as pass. `workflow_dispatch` stays the force-run escape
  # hatch for a PR that touches none of the filtered paths.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      stress:
        description: "iOS repeat ids as a JSON array — [1] for one run, [1,2,3,4,5] for a 5x flake check"
        type: string
        default: "[1]"
      android:
        description: "Also run the Android emulator job (#1035)"
        type: boolean
        default: false

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect whether this push/PR touches anything mobile-relevant. On push /
  # workflow_dispatch the real jobs run unconditionally, so this output is
  # only consulted for pull_request events. Keep the filter list in sync with
  # the `.github/workflows/mobile-e2e.yml` self-reference below.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    # `pull-requests: read` so `dorny/paths-filter` can list the PR's changed
    # files via the API under restrictive permissions (matches e2e.yml).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mobile:
              - "mobile/**"
              - "frontend/**"
              - "shared/**"
              - "server/**"
              - "db/**"
              - "ui_tests/maestro/**"
              - "**/Cargo.toml"
              - "Cargo.lock"
              - "**/Dioxus.toml"
              - "flake.lock"
              - "flake.nix"
              - ".github/workflows/mobile-e2e.yml"
              - ".github/actions/ci-gate/action.yml"

  maestro-ios:
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' || github.event_name != 'pull_request' }}
    # Single runs keep the bare name (stable check name); stress repeats > 1
    # get a suffix so the instances are tellable apart in the checks UI.
    name: maestro (iOS simulator${{ matrix.repeat != 1 && format(', repeat {0}', matrix.repeat) || '' }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      # Stress runs must report every instance — one flaky repeat cancelling
      # the rest would hide the very signal the matrix exists to collect.
      fail-fast: false
      matrix:
        repeat: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.stress || '[1]') }}
    permissions:
      contents: read
      actions: write
      # Codecov's tokenless OIDC upload path (test-results upload below).
      id-token: write
    env:
      CARGO_TARGET_DIR: ./target
      # Seeds a known admin on server boot — not needed by the current
      # pre-login flows, but in place for the login flow that comes next.
      OMNIBUS_DEV_SEED_USER: "admin:omnibus-dev"
      # The XCUITest driver install (xcodebuild of Maestro's runner) can blow
      # past the default startup timeout on a busy CI host — observed as
      # IOSDriverTimeoutException "iOS driver not ready in time" (#1034).
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"
      MAESTRO_CLI_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v4

      # Kicked off first so the simulator boots in parallel with the Nix
      # install, cache restores, and both builds (~8 min of overlap); the
      # install step below waits on `bootstatus` before touching it.
      # Pick the newest available iOS runtime, then choose an iPhone from
      # THAT runtime's own supportedDeviceTypes — guarantees a compatible
      # pair. Selecting a device type from the global list instead lands on
      # traps: the iPod touch is filed under the iPhone family, and an old
      # iPhone (e.g. 6s) paired with a current runtime fails with
      # "Incompatible device". The name prefix drops iPod/iPad.
      - name: Boot iOS simulator (background)
        run: |
          set -euo pipefail
          runtimes=$(xcrun simctl list runtimes -j)
          runtime=$(echo "$runtimes" \
            | jq -r '[.runtimes[] | select(.isAvailable and (.identifier | test("iOS")))] | last | .identifier')
          device_type=$(echo "$runtimes" | jq -r --arg rt "$runtime" \
            '.runtimes[] | select(.identifier==$rt) | .supportedDeviceTypes
             | map(select(.name | test("^iPhone"))) | last | .identifier')
          echo "creating sim: device_type=$device_type runtime=$runtime"
          udid=$(xcrun simctl create maestro-ci "$device_type" "$runtime")
          xcrun simctl boot "$udid"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-mobile-e2e-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-mobile-e2e-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-mobile-e2e-${{ runner.os }}-
          purge-last-accessed: 604800
          purge-primary-key: never
          gc-max-store-size-macos: 5G

      # macOS-arm64 target dir — a different cache bucket from the Linux
      # workflows' `shared-key: omnibus` by construction (rust-cache keys
      # include the runner OS), so this shares only across mobile-e2e runs.
      # cache-on-failure so a run that fails after the build still warms the
      # cache — the iOS build is the slow part, and early runs fail downstream.
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: omnibus-mobile-e2e
          cache-on-failure: true

      # Debug builds on purpose: both binaries are one-shot test fixtures,
      # and debug compiles much faster than release on a cold cache. (The
      # web E2E workflow needs release only to strip the dx hot-reload
      # overlay from the WASM bundle — no WASM here.)
      - name: Build native server
        run: nix develop --command cargo build -p omnibus

      - name: Build iOS simulator app
        run: nix develop .#mobile --command dx build --platform ios --package omnibus-mobile

      # The extra pre-warm launch loads dyld caches and spawns the WebKit
      # processes once before Maestro measures anything — the first-ever
      # launch on a cold simulator is the jankiest, and that jank is what
      # drops typed characters and blanks the WebView (#1034).
      - name: Install app on simulator
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$SIM_UDID"
          app=$(find "$CARGO_TARGET_DIR/dx/omnibus-mobile" -type d -name "*.app" -path "*ios*" -print0 \
            | xargs -0 ls -dt | head -1)
          echo "installing $app"
          xcrun simctl install "$SIM_UDID" "$app"
          xcrun simctl launch "$SIM_UDID" com.omnibus.mobile

      # Backgrounded with `nohup ... &` + `disown` so the server survives the
      # step's shell exit (same pattern as e2e.yml). The simulator shares the
      # host network, so the app reaches it at 127.0.0.1 directly.
      # The dioxus fullstack server reads a `public/` dir next to the binary on
      # boot and panics if it's missing; a plain `cargo build` (vs `dx bundle`)
      # doesn't create one. An empty dir satisfies it — the mobile flows only
      # touch `/api/*`, never web assets.
      - name: Start server
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            mkdir -p target/debug/public
            nohup env PORT=3000 ./target/debug/omnibus >server.log 2>&1 &
            disown
            for _ in $(seq 60); do
              curl -fsS http://127.0.0.1:3000/api/_health >/dev/null 2>&1 && exit 0
              sleep 1
            done
            echo "server never became healthy" >&2
            tail -50 server.log >&2
            exit 1
          '

      # Whole-suite retry (3 attempts) on top of the per-flow `retry` blocks:
      # the residual failure modes are environmental — XCUITest driver startup
      # timeouts, the app's WebView process dying under CI load, Maestro's
      # typeText dropping characters on a janky sim — and all three recover on
      # a fresh invocation. A real regression still fails all 3 attempts, and
      # a flaky pass is surfaced loudly (warning annotation + step summary)
      # rather than swallowed.
      - name: Run Maestro flows
        id: maestro
        run: |
          nix develop .#mobile --command bash -c '
            set -uo pipefail
            for attempt in 1 2 3; do
              echo "::group::maestro attempt $attempt/3"
              if maestro test \
                   --format junit --output maestro-report.xml \
                   -e SERVER_URL=http://127.0.0.1:3000 \
                   ui_tests/maestro/flows/; then
                echo "::endgroup::"
                echo "attempts=$attempt" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::endgroup::"
            done
            echo "attempts=3" >> "$GITHUB_OUTPUT"
            exit 1
          '

      # Per-flow results (name, status, duration) into the run's step summary
      # and check annotations, pass or fail. annotate_only keeps it inside
      # this job's permissions — no checks:write needed.
      - name: Publish Maestro results
        if: ${{ always() && hashFiles('maestro-report.xml') != '' }}
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: maestro-report.xml
          annotate_only: true
          detailed_summary: true
          include_passed: true

      # Same JUnit report → Codecov Test Analytics. Best-effort; never gates.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && hashFiles('maestro-report.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: maestro-report.xml
          report_type: test_results
          flags: mobile
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Report suite attempts
        if: ${{ always() && steps.maestro.outputs.attempts != '' }}
        run: |
          n="${{ steps.maestro.outputs.attempts }}"
          echo "Maestro suite attempts: $n/3" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.maestro.outcome }}" = "success" ] && [ "$n" != "1" ]; then
            echo "::warning title=Flaky Maestro run::suite passed only on attempt $n of 3 — check the maestro-artifacts-ios-r${{ matrix.repeat }} artifact"
          fi

      # Maestro writes per-flow logs + failure screenshots under ~/.maestro.
      # Also kept on a flaky pass (attempts > 1) so the flake is diagnosable
      # after the fact, not just when it hard-fails.
      - name: Upload Maestro artifacts
        if: ${{ failure() || steps.maestro.outputs.attempts > 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: maestro-artifacts-ios-r${{ matrix.repeat }}
          path: ~/.maestro/tests
          retention-days: 7

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-server-log-ios-r${{ matrix.repeat }}
          path: server.log
          retention-days: 7

  # Manual-only (the `android` dispatch input): the build + server + emulator
  # boot are green, but the flows themselves still fail on the emulator
  # (WebView text selectors under investigation — #1035). Opt in from the
  # Actions tab to iterate; the input default keeps iOS-only stress runs from
  # spinning emulators.
  maestro-android:
    name: maestro (Android emulator)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.android }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    env:
      # ABSOLUTE, unlike the iOS job's ./target. dx resolves a relative
      # CARGO_TARGET_DIR against the package dir (mobile/) when building the
      # Android app, so a relative path makes wry's WRY_ANDROID_KOTLIN_FILES_OUT_DIR
      # relative too — and the pre-created dir (see the build step) lands in the
      # wrong place. An absolute base removes the CWD ambiguity.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      OMNIBUS_DEV_SEED_USER: "admin:omnibus-dev"
    steps:
      - uses: actions/checkout@v4

      # Hardware acceleration for the x86_64 emulator — without KVM the
      # emulator boots so slowly the job times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-mobile-e2e-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-mobile-e2e-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-mobile-e2e-${{ runner.os }}-
          purge-last-accessed: 604800
          purge-primary-key: never
          gc-max-store-size-linux: 5G

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: omnibus-mobile-e2e
          cache-on-failure: true

      - name: Build native server
        run: nix develop --command cargo build -p omnibus

      # x86_64 APK: GHA Linux KVM runners are x86_64 hosts, so the emulator
      # runs x86_64 system images — the default aarch64-linux-android build
      # would install but crash on an incompatible ABI. The runner image's
      # preinstalled SDK/NDK are picked up by the flake's shellHook
      # (ANDROID_HOME is preset; the hook fills ANDROID_NDK_HOME from
      # $ANDROID_HOME/ndk).
      # Work around dioxus#3068: dx exports WRY_ANDROID_KOTLIN_FILES_OUT_DIR but
      # never creates that dir before wry's build script runs, so wry
      # canonicalizes a missing path and panics — deterministically (it's not a
      # race; the dir is only created after a build that can't complete).
      # Pre-create it and dx writes its kotlin glue there and bundles the APK
      # (verified locally: the resulting APK carries the lib/x86_64 .so the
      # emulator needs). CARGO_TARGET_DIR is absolute (job env) so this path is
      # the exact one dx hands wry — see the note there.
      - name: Build Android emulator app
        run: |
          nix develop .#mobile --command bash -c '
            set -euo pipefail
            mkdir -p "$CARGO_TARGET_DIR/dx/omnibus-mobile/debug/android/app/app/src/main/kotlin/dev/dioxus/main"
            dx build --platform android --package omnibus-mobile --target x86_64-linux-android
          '

      # Empty public/ dir so the fullstack server doesn't panic on boot — see
      # the iOS job's Start server step for the full rationale.
      - name: Start server
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            mkdir -p target/debug/public
            nohup env PORT=3000 ./target/debug/omnibus >server.log 2>&1 &
            disown
            for _ in $(seq 60); do
              curl -fsS http://127.0.0.1:3000/api/_health >/dev/null 2>&1 && exit 0
              sleep 1
            done
            echo "server never became healthy" >&2
            tail -50 server.log >&2
            exit 1
          '

      # The action boots the emulator, runs `script`, and tears down. Inside
      # the emulator the host's loopback is 10.0.2.2, not 127.0.0.1 — the
      # flows take SERVER_URL precisely so this stays a parameter.
      # `google_apis` images ship the Android System WebView the hybrid app
      # renders in; AOSP (`default`) images do too, but google_apis matches
      # what real devices run.
      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim
          script: |
            # Newest matching APK by mtime — deterministic if a prior build or
            # variant left stale APKs in the tree (mirrors the iOS .app pick).
            apk=$(find target/dx/omnibus-mobile -name '*.apk' -path '*android*' -print0 | xargs -0 ls -t | head -1)
            echo "installing $apk"
            adb install -r "$apk"
            nix develop .#mobile --command maestro test -e SERVER_URL=http://10.0.2.2:3000 ui_tests/maestro/flows/

      - name: Upload Maestro artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-artifacts-android
          path: ~/.maestro/tests
          retention-days: 7

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-server-log-android
          path: server.log
          retention-days: 7

  # The required status check for this workflow. Always runs (`if: always()`),
  # so branch protection gets a resolved status whenever mobile-e2e triggers —
  # green when maestro-ios passed (or was skipped by the `changes` filter),
  # red when it failed or was cancelled. `maestro-android` is included too so
  # that an opted-in `workflow_dispatch` run (`inputs.android: true`) that
  # fails Android also fails the gate; on the normal PR/push path Android is
  # skipped by its own `if:` (#1035) and skipped counts as pass, so it never
  # blocks those runs. Mark ONLY `🔒 Mobile E2E Required` as required in
  # branch protection; do not require `maestro-ios` directly (its matrix-repeat
  # check name varies with `stress` and would hang the merge).
  mobile-e2e-required:
    name: 🔒 Mobile E2E Required
    needs: [changes, maestro-ios, maestro-android]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-gate
        with:
          needs: ${{ toJSON(needs) }}
