name: TestFlight

# The run title carries the version, so the Actions list distinguishes builds
# without opening the run (e.g. "TestFlight v0.14.3"). run-name is evaluated
# before any job starts, so it can only see the dispatch inputs — when
# marketing_version is left blank the version job resolves it from the latest
# v* tag, which run-name can't know yet.
run-name: "TestFlight ${{ inputs.marketing_version && format('v{0}', inputs.marketing_version) || 'latest tag' }}"

# Manually-triggered iOS build + TestFlight upload for the native SwiftUI app
# (omnibus-ios/ Xcode project, bundle com.omnibus.mobile). The Apple side must
# already exist: the app record, the distribution cert, the App Store Connect
# API key, and — because the app embeds a widget extension — **two** App IDs
# with **two** App Store provisioning profiles, one per embedded bundle.
#
# The build is a real .xcodeproj archived unsigned by `xcodebuild archive`,
# signed at `xcodebuild -exportArchive` time (manual signing, with one
# ExportOptions.plist `provisioningProfiles` entry per embedded bundle) and
# uploaded with `xcrun altool`. The cert-import + profile-install lives in
# .github/actions/ios-signing.
#
# Required repository secrets:
#   Shared (team/account-scoped):
#     IOS_DIST_CERT_P12_BASE64          base64 of the Apple Distribution .p12
#     IOS_DIST_CERT_PASSWORD            password for that .p12
#     ASC_API_KEY_BASE64                base64 of the App Store Connect AuthKey_*.p8
#     ASC_KEY_ID                        App Store Connect API key ID
#     ASC_ISSUER_ID                     App Store Connect API issuer ID
#   Per-app (a profile is bound to one bundle ID):
#     IOS_PROVISIONING_PROFILE_BASE64   App Store profile for com.omnibus.mobile
#     IOS_WIDGETS_PROVISIONING_PROFILE_BASE64
#                                       App Store profile for
#                                       com.omnibus.mobile.widgets
#
# The app embeds a WidgetKit extension, and manual signing needs one profile
# per embedded bundle — so both secrets are required, and both App IDs must
# carry the App Groups capability with group.com.omnibus.mobile. The *existing*
# com.omnibus.mobile profile therefore has to be regenerated, not just reused:
# a profile does not pick up a capability added after it was created.
#
# Getting that wrong does not fail loudly. The archive is built unsigned, so
# the binaries carry no entitlements and export derives them wholly from the
# profiles — a profile without the App Group produces an IPA that exports,
# uploads and installs, whose widgets then render their placeholder forever.
# Hence the checks: ios-signing asserts each profile's app id, App Group and
# distribution type before the archive, and the export step re-checks the
# signed IPA. The simulator lanes prove none of this; they sign ad-hoc.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion to stamp (must be higher than the last uploaded build). Defaults to the workflow run number."
        required: false
        type: string
      marketing_version:
        description: "CFBundleShortVersionString (user-visible version). Defaults to the latest v* release tag, so it tracks the server release."
        required: false
        type: string

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Resolve the user-visible marketing version. Prefer the dispatch input;
  # otherwise the latest v* git tag (the same tags release.yml mints), so
  # TestFlight tracks the server release.
  version:
    name: resolve marketing version
    runs-on: ubuntu-latest
    outputs:
      marketing_version: ${{ steps.resolve.outputs.version }}
    steps:
      # fetch-depth: 0 pulls full history + tags so `git describe` can find the
      # latest release tag (checkout fetches neither by default).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve marketing version
        id: resolve
        env:
          INPUT_VERSION: ${{ github.event.inputs.marketing_version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            tag="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)"
            [ -n "$tag" ] || { echo "::error::No v* git tag found and no marketing_version input given."; exit 1; }
            version="${tag#v}"
          fi
          # Reject anything but digits and dots before writing to $GITHUB_OUTPUT: a
          # dispatch input containing a newline would otherwise inject extra output
          # assignments.
          case "$version" in
            '' | *[!0-9.]*) echo "::error::marketing version must be numeric/dot-separated, got: '$version'"; exit 1 ;;
          esac
          echo "Marketing version: $version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  # ---- ios: native SwiftUI app (com.omnibus.mobile) ---------------------------
  ios:
    name: ios (native · com.omnibus.mobile)
    needs: version
    # omnibus-ios targets iOS 26.4, so it needs the Xcode 26 / iOS 26 SDK on
    # macos-26. App Store Connect also rejects any upload built with an older
    # SDK, so macos-14/15 (Xcode 15/16) can't be used.
    runs-on: macos-26
    permissions:
      contents: read
      # Granted for the .ipa upload step. Belt-and-braces rather than load-bearing:
      # upload-artifact@v4 authenticates with ACTIONS_RUNTIME_TOKEN, which is
      # injected per-job and isn't governed by `permissions:`.
      actions: write
    env:
      # Validated in the Archive step. Defaulting to run_number is only
      # monotonic if nobody has ever dispatched a higher literal — once
      # someone does, every later default is rejected by App Store Connect
      # for going backwards.
      BUILD_NUMBER: ${{ github.event.inputs.build_number || github.run_number }}
      MARKETING_VERSION: ${{ needs.version.outputs.marketing_version }}
      # The team the omnibus-ios project + the distribution cert belong to.
      DEVELOPMENT_TEAM: "D33VSDXHA6"
      BUNDLE_ID: com.omnibus.mobile
      # Asserted against both profiles before the archive, and against the
      # exported IPA afterwards. Must match `WidgetStore.appGroupID` and both
      # .entitlements files.
      APP_GROUP_ID: group.com.omnibus.mobile
      # Must match the App ID of the profile in
      # IOS_WIDGETS_PROVISIONING_PROFILE_BASE64. That is the binding
      # constraint, and the reason this can't be derived from the project:
      # when it last broke, this value and PRODUCT_BUNDLE_IDENTIFIER agreed
      # with each other and disagreed with Apple's portal, so any check
      # against the pbxproj would have passed and shipped the same failure.
      # It has to equal PRODUCT_BUNDLE_IDENTIFIER as well — just don't read
      # that agreement as evidence. Note it is deliberately *not* the target
      # name: the product is OmnibusWidgets.appex and the id ends `.widgets`.
      WIDGET_BUNDLE_ID: com.omnibus.mobile.widgets
    steps:
      - uses: actions/checkout@v4

      - name: iOS signing setup
        id: signing
        uses: ./.github/actions/ios-signing
        with:
          cert-p12-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          cert-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          profile-base64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          extension-profile-base64: ${{ secrets.IOS_WIDGETS_PROVISIONING_PROFILE_BASE64 }}
          expected-team: ${{ env.DEVELOPMENT_TEAM }}
          expected-bundle-id: ${{ env.BUNDLE_ID }}
          expected-extension-bundle-id: ${{ env.WIDGET_BUNDLE_ID }}
          require-app-group: ${{ env.APP_GROUP_ID }}

      # Archive unsigned. Signing settings passed on the xcodebuild command line
      # apply to every target in the build — including SPM-generated resource
      # bundles (ZIPFoundation_ZIPFoundation), which reject a manually specified
      # profile and fail the archive. Signing happens at export instead, where
      # ExportOptions.plist scopes the profile to the app's bundle id.
      # MARKETING_VERSION + CURRENT_PROJECT_VERSION are passed as build settings
      # so the archive is stamped without editing the pbxproj.
      - name: Archive
        run: |
          set -euo pipefail
          # CURRENT_PROJECT_VERSION must be a dotted integer sequence. An input
          # like "1.0-rc1" builds happily and is only rejected once App Store
          # Connect processes the upload, minutes after the run goes green.
          case "$BUILD_NUMBER" in
            '' | *[!0-9.]*)
              echo "::error::build_number must be numeric/dot-separated, got: '$BUILD_NUMBER'"
              exit 1 ;;
          esac
          xcodebuild \
            -project omnibus-ios/omnibus.xcodeproj \
            -scheme omnibus \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/omnibus.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      # Build ExportOptions.plist with PlistBuddy (avoids heredoc-in-YAML
      # indentation pitfalls). method=app-store-connect is the Xcode 26 name for
      # an App Store export.
      - name: Write ExportOptions.plist
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile-name }}
          WIDGET_PROFILE_NAME: ${{ steps.signing.outputs.extension-profile-name }}
        run: |
          set -euo pipefail
          PLIST="$RUNNER_TEMP/ExportOptions.plist"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict/></plist>' > "$PLIST"
          pb() { /usr/libexec/PlistBuddy -c "$1" "$PLIST"; }
          pb "Add :method string app-store-connect"
          pb "Add :teamID string $DEVELOPMENT_TEAM"
          pb "Add :signingStyle string manual"
          pb "Add :signingCertificate string Apple Distribution"
          pb "Add :provisioningProfiles dict"
          pb "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_NAME"
          # One entry per embedded bundle. Fail here with something that names
          # the cause rather than letting -exportArchive report the appex as
          # simply unprovisioned.
          if [ -z "$WIDGET_PROFILE_NAME" ]; then
            echo "::error::IOS_WIDGETS_PROVISIONING_PROFILE_BASE64 is not set. The app embeds $WIDGET_BUNDLE_ID, and manual signing needs a profile per embedded bundle."
            exit 1
          fi
          pb "Add :provisioningProfiles:$WIDGET_BUNDLE_ID string $WIDGET_PROFILE_NAME"
          pb "Add :uploadSymbols bool true"
          pb "Add :destination string export"

      # Signs the (unsigned) archive: cert + profile come from ExportOptions.plist,
      # and codesign finds the identity because the ios-signing action prepended
      # the throwaway keychain to the user search list.
      - name: Export .ipa
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/omnibus.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          # exportArchive names the .ipa after the product; copy to a stable path.
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -n1)"
          cp "$IPA" "$GITHUB_WORKSPACE/omnibus-ios.ipa"

      # The archive is built unsigned (CODE_SIGNING_ALLOWED=NO), so the binaries
      # carry no entitlements of their own — export derives them entirely from
      # the provisioning profiles. That makes a missing App Group a *silent*
      # outcome rather than a loud one: the IPA exports, uploads, installs, and
      # every widget renders its placeholder forever, because
      # containerURL(forSecurityApplicationGroupIdentifier:) returns nil. The
      # profile checks in ios-signing catch it earlier; this proves it of the
      # artifact actually being shipped.
      - name: Verify the exported IPA carries the App Group
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/ipa-check"
          rm -rf "$WORK" && mkdir -p "$WORK"
          unzip -q "$GITHUB_WORKSPACE/omnibus-ios.ipa" -d "$WORK"
          APP="$(ls -d "$WORK"/Payload/*.app | head -n1)"

          fail=0
          for BUNDLE in "$APP" "$APP"/PlugIns/*.appex; do
            [ -e "$BUNDLE" ] || continue
            NAME="$(basename "$BUNDLE")"
            ENTS="$(codesign -d --entitlements - --xml "$BUNDLE" 2>/dev/null || true)"
            case "$ENTS" in
              *"$APP_GROUP_ID"*)
                echo "$NAME carries $APP_GROUP_ID." ;;
              *)
                echo "::error::$NAME was signed without the App Group $APP_GROUP_ID. Its provisioning profile does not grant it, so the widget would install and silently render nothing. Add App Groups to that bundle's App ID and regenerate the profile."
                fail=1 ;;
            esac
          done
          [ "$fail" -eq 0 ] || exit 1

      - name: Upload to TestFlight
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          # An empty secret otherwise writes a zero-byte .p8 and surfaces as an
          # opaque altool authentication error rather than a named cause.
          if [ -z "$ASC_API_KEY_BASE64" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::error::One of ASC_API_KEY_BASE64 / ASC_KEY_ID / ASC_ISSUER_ID is unset."
            exit 1
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_API_KEY_BASE64" | base64 -D > "$KEY_PATH"
          trap 'rm -f "$KEY_PATH"' EXIT

          # Validate before uploading. `--upload-app` only proves the bytes
          # arrived: everything appex-specific — entitlement validity, asset
          # catalogue completeness, device-family and MinimumOSVersion
          # agreement between the app and its extension — is checked
          # asynchronously afterwards and reported by email. Without this the
          # run goes green and the build simply never appears in TestFlight,
          # which is indistinguishable from success right up until someone
          # goes looking for it.
          xcrun altool --validate-app -f "$GITHUB_WORKSPACE/omnibus-ios.ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

          xcrun altool --upload-app -f "$GITHUB_WORKSPACE/omnibus-ios.ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload .ipa artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omnibus-ios-ipa
          path: omnibus-ios.ipa
          if-no-files-found: ignore

      - name: Clean up signing keychain
        if: always()
        env:
          SIGNING_KEYCHAIN: ${{ steps.signing.outputs.keychain-path }}
        run: |
          set -euo pipefail
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          rm -f "$HOME/.appstoreconnect/private_keys"/*.p8 2>/dev/null || true
