[package]
name = "omnibus"
version = "0.1.0"
edition = "2021"
license.workspace = true

# Unified Dioxus fullstack binary. Built twice by `dx serve`:
# - Once as native (features: `server`) — axum backend + SSR + DB
# - Once as WASM (features: `web`) — hydrated client
#
# All server-only deps are gated behind the `server` feature so the WASM
# build side doesn't try to compile sqlx/tokio/axum.

[dependencies]
dioxus = "0.7"

# Server-only deps — all optional and gated behind the `server` feature.
axum = { version = "0.8", features = ["multipart"], optional = true }
axum-extra = { version = "0.12", features = ["cookie"], optional = true }
# Prometheus HTTP metrics middleware + `/metrics` exposition. Groups path
# labels by matched route (not raw id) so cardinality stays bounded.
axum-prometheus = { version = "0.10", optional = true }
tower-http = { version = "0.7", features = ["trace", "timeout", "set-header", "fs"], optional = true }
tower = { version = "0.5", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# PIN RATIONALE (#1529): held at 0.8 — see db/Cargo.toml for the full
# SqlSafeStr migration rationale; keep all three crates (`server/`, `db/`,
# `frontend/`) on 0.8 in lockstep, lifted only when that migration lands.
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros"], optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"], optional = true }
tracing = { workspace = true, optional = true }
# Owns the global subscriber (RUST_LOG-driven console logs); installed before
# `dioxus::serve` so dioxus-logger's default subscriber never takes over. The
# `json` feature backs the durable on-disk log sink (#939).
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
# Non-blocking rolling-file appender for the on-disk JSON log sink. Its
# `WorkerGuard` must outlive the process so buffered records flush on shutdown.
tracing-appender = { version = "0.2", optional = true }
time = { version = "0.3", features = ["formatting", "parsing"], optional = true }
futures-util = { version = "0.3", optional = true }
# Fixed-digest derivation for the Kobo auth envelope. Deliberately not
# `DefaultHasher`, whose output is not stable across toolchain versions —
# a rotation there would drift the values a device caches across a deploy
# (the same trap `db::helpers::stable_uuid` documents).
sha2 = { version = "0.10", optional = true }
# Re-exported by dioxus::serve as the return error type, and used by the
# native startup helpers in main.rs that previously lived inside an inline
# closure (where `?` upgraded any error via type inference).
anyhow = { version = "1.0", optional = true }
# IMF-fixdate parsing/formatting for the conditional-request layer's
# `If-Modified-Since` / `If-Unmodified-Since` / date-form `If-Range`, and the
# `Last-Modified` it publishes. Already in the tree via tower-http/hyper, so
# depending on it directly unifies rather than adding a build.
httpdate = { version = "1.0", optional = true }
# Wraps the open file handle a media response streams from, so a
# multi-hundred-MB audiobook is never buffered into memory.
tokio-util = { version = "0.7", features = ["io"], optional = true }
# Staging temp files for the upload-inspect parse path in
# `backend::uploads` (RAII cleanup on drop). Also a dev-dependency below for
# the integration tests; listed here so the server lib can use it directly.
tempfile = { workspace = true, optional = true }
# Percent-encoding the OPDS search feed's `self` link query — already in the
# tree via `omnibus-db`, so depending on it directly unifies rather than
# adding a build.
urlencoding = { version = "2", optional = true }

omnibus-shared = { path = "../shared" }
# `features` here are forwarded via our own feature flags below. Leaving it
# bare means frontend compiles with no platform feature (components only).
omnibus-frontend = { path = "../frontend" }
# DB + indexing pipeline. Depended on directly (not transitively via
# frontend) since main.rs and backend.rs call init_db/get_settings/etc.
# straight. Optional so the `web` (WASM) build doesn't try to drag it in.
omnibus-db = { path = "../db", optional = true }

[dev-dependencies]
tower = "0.5"
# Test-only view of the same db crate, with `test-support` on so integration
# tests can reuse `EnvVarGuard` instead of hand-rolling env isolation. Cargo
# unifies this with the optional `omnibus-db` above for test builds only.
omnibus-db = { path = "../db", features = ["test-support"] }
# RAII temp directories so panicking integration tests don't leak fixture
# copies under /tmp. Already a transitive dep elsewhere — explicit here only
# for the backend integration tests.
tempfile.workspace = true
# Mock HTTP server for tests that exercise the remote-image fetcher in
# `db::author_photos::fetch_remote_image`. Already pinned at this version
# in `db`'s dev-deps so cargo unifies on one build.
wiremock = "0.6"
# Parse the EPUB returned by the `/download` route to assert the override was
# baked into its metadata (F5.8 #1372). Same version as `db`'s dependency, so
# cargo unifies on one build.
epub = "2"
# Encode `Authorization: Basic` credentials in the OPDS Basic-auth tests.
# Same version as `db`'s dependency, so cargo unifies on one build.
base64 = "0.22"

[features]
default = ["server"]
# Native server build: axum backend + SSR + DB. Also activates
# `omnibus-frontend/server` so server-function bodies compile in.
server = [
    "dep:axum",
    "dep:axum-extra",
    "dep:axum-prometheus",
    "dep:tower-http",
    "dep:httpdate",
    "dep:tokio-util",
    "dep:tower",
    "dep:serde",
    "dep:serde_json",
    "dep:sqlx",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tracing-appender",
    "dep:time",
    "dep:futures-util",
    "dep:urlencoding",
    "dep:sha2",
    "dep:anyhow",
    "dep:tempfile",
    "dep:omnibus-db",
    "dioxus/server",
    "omnibus-frontend/server",
]
# WASM client build (activated by `dx serve --platform web`).
web = ["dioxus/web", "omnibus-frontend/web"]
