[package]
name = "omnibus"
version = "0.1.0"
edition = "2021"
license.workspace = true

# Unified Dioxus fullstack binary. Built twice by `dx serve`:
# - Once as native (features: `server`) — axum backend + SSR + DB
# - Once as WASM (features: `web`) — hydrated client
#
# All server-only deps are gated behind the `server` feature so the WASM
# build side doesn't try to compile sqlx/tokio/axum.

[dependencies]
dioxus = "0.7"

# Server-only deps — all optional and gated behind the `server` feature.
axum = { version = "0.8", features = ["multipart"], optional = true }
axum-extra = { version = "0.12", features = ["cookie"], optional = true }
tower-http = { version = "0.7", features = ["trace", "timeout", "set-header", "fs"], optional = true }
tower = { version = "0.5", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# Held back at 0.8 — see the rationale on `omnibus-db`'s `sqlx` dep in
# db/Cargo.toml (issue #774). Must stay lock-stepped with `omnibus-db`.
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros"], optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"], optional = true }
tracing = { workspace = true, optional = true }
time = { version = "0.3", optional = true }
# Re-exported by dioxus::serve as the return error type, and used by the
# native startup helpers in main.rs that previously lived inside an inline
# closure (where `?` upgraded any error via type inference).
anyhow = { version = "1.0", optional = true }
# Staging temp files for the upload-inspect parse path in
# `backend::uploads` (RAII cleanup on drop). Also a dev-dependency below for
# the integration tests; listed here so the server lib can use it directly.
tempfile = { workspace = true, optional = true }

omnibus-shared = { path = "../shared" }
# `features` here are forwarded via our own feature flags below. Leaving it
# bare means frontend compiles with no platform feature (components only).
omnibus-frontend = { path = "../frontend" }
# DB + indexing pipeline. Depended on directly (not transitively via
# frontend) since main.rs and backend.rs call init_db/get_settings/etc.
# straight. Optional so the `web` (WASM) build doesn't try to drag it in.
omnibus-db = { path = "../db", optional = true }

[dev-dependencies]
tower = "0.5"
# RAII temp directories so panicking integration tests don't leak fixture
# copies under /tmp. Already a transitive dep elsewhere — explicit here only
# for the backend integration tests.
tempfile.workspace = true
# Mock HTTP server for tests that exercise the remote-image fetcher in
# `db::author_photos::fetch_remote_image`. Already pinned at this version
# in `db`'s dev-deps so cargo unifies on one build.
wiremock = "0.6"

[features]
default = ["server"]
# Native server build: axum backend + SSR + DB. Also activates
# `omnibus-frontend/server` so server-function bodies compile in.
server = [
    "dep:axum",
    "dep:axum-extra",
    "dep:tower-http",
    "dep:tower",
    "dep:serde",
    "dep:serde_json",
    "dep:sqlx",
    "dep:tokio",
    "dep:tracing",
    "dep:time",
    "dep:anyhow",
    "dep:tempfile",
    "dep:omnibus-db",
    "dioxus/server",
    "omnibus-frontend/server",
]
# WASM client build (activated by `dx serve --platform web`).
web = ["dioxus/web", "omnibus-frontend/web"]
