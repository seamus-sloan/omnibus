{{- if and (include "omnibus.hasSecrets" .) (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omnibus.fullname" . }}
  labels:
    {{- include "omnibus.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.hardcoverApiKey }}
  HARDCOVER_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.googleBooksApiKey }}
  GOOGLE_BOOKS_API_KEY: {{ . | quote }}
  {{- end }}
  {{- if .Values.secrets.smtp.host }}
  SMTP_HOST: {{ .Values.secrets.smtp.host | quote }}
  SMTP_PORT: {{ .Values.secrets.smtp.port | quote }}
  SMTP_SECURITY: {{ .Values.secrets.smtp.security | quote }}
  SMTP_FROM_EMAIL: {{ required "secrets.smtp.fromEmail is required when secrets.smtp.host is set" .Values.secrets.smtp.fromEmail | quote }}
  {{- with .Values.secrets.smtp.username }}
  SMTP_USERNAME: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.smtp.password }}
  SMTP_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
