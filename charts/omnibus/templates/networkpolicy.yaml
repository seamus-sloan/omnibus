{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "omnibus.fullname" . }}
  labels:
    {{- include "omnibus.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "omnibus.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 3000
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Cover art, author photos, and the Open Library / Google Books / Hardcover
    # metadata ladder.
    - ports:
        - port: 443
          protocol: TCP
    {{- if .Values.secrets.smtp.host }}
    # Send-to-Kindle relay.
    - ports:
        - port: {{ .Values.secrets.smtp.port }}
          protocol: TCP
    {{- end }}
{{- end }}
