apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "omnibus.fullname" . }}-test-health"
  labels:
    {{- include "omnibus.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      image: curlimages/curl:8.11.1
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      args:
        - /bin/sh
        - -ec
        - |
          # /api/_health is unauthenticated by design, and its `app` field is
          # what distinguishes omnibus from anything else on the port.
          body="$(curl -fsS --max-time 10 \
            "http://{{ include "omnibus.fullname" . }}:{{ .Values.service.port }}/api/_health")"
          echo "$body"
          echo "$body" | grep -q '"app":"omnibus"'
          echo "$body" | grep -q '"status":"ok"'
