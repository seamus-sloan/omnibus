# Omnibus — self-hosted ebook/audiobook library.
#
# Omnibus stores everything in ONE SQLite file. That single fact drives the
# workload shape: one replica, Recreate rollouts, ReadWriteOnce volumes.
# See this chart's README.md for the reasoning.

image:
  repository: sesloan/omnibus
  # Defaults to .Chart.AppVersion. Pin a digest in production.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

## -----------------------------------------------------------------------------
## Access URL
## -----------------------------------------------------------------------------
# OMNIBUS_PUBLIC_ORIGIN is an allowlist of the exact origin(s) you load the app
# from. The CSRF gate (server/src/auth/csrf.rs) rejects cookie-authed POSTs
# whose Origin/Referer isn't on it — a mismatch is a silent 403 on every write
# while GETs keep working, which is the most common way to misconfigure this.
#
# Leave empty and the chart derives it from `ingress.hosts` (scheme per host,
# from `ingress.tls`). Set it explicitly for a LoadBalancer/NodePort install,
# or to list extra origins (comma-separated).
publicOrigin: ""

# Session cookies are Secure-only by default, so a browser never sends them
# over plain http:// and login appears to succeed but doesn't stick.
# Empty = auto: true when the derived origin is https. Force with "true"/"false".
secureCookies: ""

## -----------------------------------------------------------------------------
## Libraries — your existing media
## -----------------------------------------------------------------------------
# The chart deliberately does NOT provision these. Your books already live
# somewhere, so each entry takes a raw Kubernetes volume source spliced into the
# pod as-is (PVC, NFS, hostPath, CSI — all work).
#
# `volume` ships EMPTY on purpose. Helm deep-merges values files, so a default
# source here would merge with — not be replaced by — yours, producing a volume
# with two sources that the API server rejects. Enabling a library without a
# volume fails the render with a message saying so.
#
# Both default off so the chart renders bare; enable the ones you have.
# The ebook mount must stay writable: in-app uploads land there.
libraries:
  ebooks:
    enabled: false
    mountPath: /books
    readOnly: false
    volume: {}
    #  persistentVolumeClaim:
    #    claimName: omnibus-ebooks
    #  --- or ---
    #  nfs:
    #    server: 10.0.0.5
    #    path: /export/ebooks
  audiobooks:
    enabled: false
    mountPath: /audiobooks
    readOnly: true
    volume: {}

# Publish the mount paths as EBOOK_LIBRARY_PATH / AUDIOBOOK_LIBRARY_PATH, which
# the server re-seeds into its settings row on EVERY boot.
#
# Set false to manage library paths from the in-app Settings page instead —
# required if an admin ever sets them in the UI, because the boot hook
# (db::settings::seed_settings_from_env) overwrites BOTH rows whenever either
# env var is present, so a chart that sets only one silently clears the other.
libraryPathsFromEnv: true

## -----------------------------------------------------------------------------
## Persistence
## -----------------------------------------------------------------------------
persistence:
  # Durable state. Back this up: SQLite DB, cover images, journal images.
  config:
    enabled: true
    existingClaim: ""
    storageClass: ""
    # SQLite over a shared filesystem corrupts. Keep this RWO.
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    annotations: {}
    # Keep the PVC when the release is uninstalled.
    retain: true

  # Regenerable: thumbnails, HLS segments, KEPUB/converted output, export
  # EPUBs, logs. Safe to delete; the server rebuilds on demand. Size it above
  # the sum of the cache caps below plus headroom.
  cache:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    annotations: {}
    retain: false

## -----------------------------------------------------------------------------
## Application config (non-secret) -> ConfigMap
## -----------------------------------------------------------------------------
config:
  # tracing EnvFilter syntax. Query strings are never logged.
  logLevel: "info,omnibus=debug"

  # Max accepted upload size, bytes. If you use ingress-nginx, set a matching
  # nginx.ingress.kubernetes.io/proxy-body-size annotation below — nginx's 1 MB
  # default rejects book uploads with a 413 before the app ever sees them.
  maxUploadBytes: 1073741824 # 1 GiB

  # Cache eviction caps, bytes. Keep the total under persistence.cache.size.
  thumbsCapBytes: 1073741824 # 1 GiB
  hlsCapBytes: 5368709120 # 5 GiB
  exportEpubCapBytes: 5368709120 # 5 GiB

  # Watchdogs, seconds.
  hlsTranscodeTimeoutSecs: 1800
  convertTimeoutSecs: 600

  # Key the login throttle on X-Forwarded-For. Only enable when traffic reaches
  # the pod through a proxy that overwrites the header — otherwise any client
  # can spoof a fresh bucket. See README "Rate limiting" for a caveat.
  trustForwardedFor: false

  # ONE-TIME admin recovery: promotes this username to admin on EVERY boot
  # while set. Unset and roll the deployment immediately after use.
  initialAdmin: ""

  # Free-form extras; merged last, so these win. Anything in .env.example works.
  extraEnv: {}

## -----------------------------------------------------------------------------
## Secrets
## -----------------------------------------------------------------------------
# Rendered into a Secret unless `existingSecret` is set. Keys are used verbatim
# as env var names, so an existing Secret just needs the same key names.
secrets:
  existingSecret: ""
  # Metadata providers. Both optional; the Settings page overrides them.
  hardcoverApiKey: ""
  googleBooksApiKey: ""
  # Send-to-Kindle SMTP relay. host + fromEmail are the required pair.
  smtp:
    host: ""
    port: 587
    security: starttls # starttls | tls
    username: ""
    password: ""
    fromEmail: ""

## -----------------------------------------------------------------------------
## Workload
## -----------------------------------------------------------------------------
# NOTE: replicaCount is intentionally absent. See README "Why one replica".

# ffmpeg HLS transcodes are the CPU spike; the steady state is small.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 2Gi

# The image's entrypoint remaps a PUID/PGID user as root and drops privileges
# with gosu. Kubernetes does that with fsGroup, so the chart bypasses the
# entrypoint (command: /app/server) and runs unprivileged.
#
# On NFS-backed volumes fsGroup has no effect — set ownership on the server to
# match runAsUser/runAsGroup below, or mount with the right uid mapping.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  # Skip the recursive chown when the volume root already matches — a full
  # relabel of a large cover directory delays every pod start otherwise.
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Probes hit GET /api/_health, which is unauthenticated by design.
probes:
  startup:
    enabled: true
    # Migrations plus the norm-column backfills run before the first response.
    # 30 x 10s = 5 minutes of headroom on a cold, large database.
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 30
  readiness:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    enabled: true
    periodSeconds: 30
    timeoutSeconds: 5
    # Deliberately slack: killing a pod mid-transcode throws the work away.
    failureThreshold: 6

# The container writes only to its mounted volumes, so the root filesystem is
# read-only. SQLite and ffmpeg still want a scratch dir.
tmpDir:
  enabled: true
  sizeLimit: 1Gi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
terminationGracePeriodSeconds: 60
extraVolumes: []
extraVolumeMounts: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # The app calls no Kubernetes API.
  automountServiceAccountToken: false

## -----------------------------------------------------------------------------
## Networking
## -----------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 3000
  annotations: {}

ingress:
  enabled: false
  className: nginx
  # Worth setting on ingress-nginx:
  #   nginx.ingress.kubernetes.io/proxy-body-size: "1024m"   # match maxUploadBytes
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600" # audiobook streams
  #   nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  # /metrics is NOT behind the auth gate (only /api/* is), so block it at the
  # edge if the ingress routes / and the endpoint shouldn't be public.
  annotations: {}
  hosts:
    - host: omnibus.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: omnibus-tls
  #    hosts:
  #      - omnibus.example.com
