# Error path: unreachable server URL surfaces the error banner and stays put.
#
# Runs alphabetically AFTER connect.yaml, which just persisted a working server
# URL — so the first assertion here doubles as the state-model proof: each
# attempt's `clearState: true` wiped that URL and we're back on the first-run
# Connect screen, not auto-advanced to login. No backend needed: port 1 is
# never listening, so the health probe fails with connection-refused.
#
# Same `retry` wrapper as connect.yaml: Maestro's inputText drops characters on
# a janky/CI simulator (mobile-dev-inc/Maestro#395). A mangled URL can land on
# a *different* state (empty field → "Enter a server URL", or a stray reachable
# host), so we assert the field holds the exact unreachable URL before tapping
# Connect, and re-launch clean on any miss. Same extendedWaitUntil rationale as
# connect.yaml: a bare assertVisible's 7s default was timing out on a merely
# slow-to-repaint CI WebView, not just a genuinely dropped-character one (#902).
appId: com.omnibus.mobile
tags:
  - smoke
---
- retry:
    maxRetries: 6
    commands:
      - launchApp:
          clearState: true
      - assertVisible: "Connect to your server to get started."
      - tapOn: "https://omnibus.local:3000"
      - inputText: http://127.0.0.1:1
      - extendedWaitUntil:
          visible: "http://127.0.0.1:1"
          timeout: 15000
      - tapOn: "Connect"
      - extendedWaitUntil:
          visible: "Can't reach that server. Check the address and that it's running."
          timeout: 15000
# Still on the Connect screen — the probe failure did not advance us.
- assertVisible: "Connect to your server to get started."
