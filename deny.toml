# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
# Schema version 2 (required for cargo-deny >= 0.14).
#
# Run locally:  cargo deny check
# CI:           rust.yml `security` job, `cargo deny check` step.

# ---------------------------------------------------------------------------
# Advisories
# ---------------------------------------------------------------------------
# Deny known vulnerabilities and unmaintained crates. Advisories that are
# accepted (e.g. disputed, only affects an unused feature) can be silenced
# with an `ignore` entry below alongside a comment explaining the rationale.
[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# Yanked crates surface as warnings, not errors. Currently accepted:
# `spin 0.9.8` (yanked, no advisory) — transitive via `flume` (sqlx-sqlite)
# and `multer` (axum); collapses when either upstream drops it. See
# docs/dependency-audit.md § Yanked crates.
yanked = "warn"
# "sound" = no known exploitable vulnerability; "best-effort" also pulls in
# unmaintained / notice advisories.
ignore = [
    # rsa "Marvin Attack" timing sidechannel. `rsa` enters Cargo.lock only via
    # `sqlx-mysql`; this project uses sqlx with the sqlite backend only, so
    # `rsa` is never compiled into any target (`cargo tree -i rsa --target all`
    # is empty). No fixed `rsa` release exists yet — revisit when one ships.
    # Keep in sync with the `--ignore` flag on the cargo-audit step in rust.yml.
    { id = "RUSTSEC-2023-0071", reason = "rsa is lock-only via the unused sqlx-mysql backend; never compiled (sqlite-only), so not reachable" },

    # ---- Unmaintained (informational) advisories pulled in by the Dioxus
    # desktop/mobile native shell tree (wry/tao → gtk-rs/webkit2gtk on Linux,
    # plus a few proc-macro helpers). These are NOT vulnerabilities; they are
    # "crate is no longer maintained" notices. We accept them because:
    #   1. They originate exclusively from upstream Dioxus dependencies which
    #      we git-pin (see [sources.allow-git] below). Removing them requires
    #      upstream Dioxus to migrate off these crates — not in our control.
    #   2. cargo-audit (the blocking vulnerability gate in rust.yml's
    #      `security` job) covers real RUSTSEC vulnerabilities. cargo-deny
    #      here adds source/ban enforcement; surfacing unmaintained notices
    #      is informational, not a security gate.
    # Revisit when Dioxus upgrades the affected sub-trees.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained — transitive via Dioxus mobile/desktop crates; awaiting upstream migration" },
    { id = "RUSTSEC-2024-0411", reason = "gtk-rs GTK3 binding unmaintained — Linux-only Dioxus desktop dep (wry/tao); awaiting upstream migration to GTK4" },
    { id = "RUSTSEC-2024-0412", reason = "gtk-rs GTK3 binding unmaintained — Linux-only Dioxus desktop dep (wry/tao); awaiting upstream migration to GTK4" },
    { id = "RUSTSEC-2024-0413", reason = "gtk-rs GTK3 binding unmaintained — Linux-only Dioxus desktop dep (wry/tao); awaiting upstream migration to GTK4" },
    { id = "RUSTSEC-2024-0414", reason = "gtk-rs GTK3 binding unmaintained — Linux-only Dioxus desktop dep (wry/tao); awaiting upstream migration to GTK4" },
    { id = "RUSTSEC-2024-0415", reason = "gtk-rs GTK3 binding unmaintained — Linux-only Dioxus desktop dep (wry/tao); awaiting upstream migration to GTK4" },
    { id = "RUSTSEC-2024-0416", reason = "gtk-rs GTK3 binding unmaintained — Linux-only Dioxus desktop dep (wry/tao); awaiting upstream migration to GTK4" },
    { id = "RUSTSEC-2024-0418", reason = "gtk-rs GTK3 binding unmaintained — Linux-only Dioxus desktop dep (wry/tao); awaiting upstream migration to GTK4" },
    { id = "RUSTSEC-2024-0419", reason = "gtk-rs GTK3 binding unmaintained — Linux-only Dioxus desktop dep (wry/tao); awaiting upstream migration to GTK4" },
    { id = "RUSTSEC-2024-0420", reason = "gtk-rs GTK3 binding unmaintained — Linux-only Dioxus desktop dep (wry/tao); awaiting upstream migration to GTK4" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained — transitive via Dioxus mobile/desktop crates; awaiting upstream migration" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash unmaintained — transitive via Dioxus mobile/desktop crates; awaiting upstream migration" },

    # ---- Unsound (informational) advisories in the Dioxus desktop/mobile
    # GTK/WebKit tree. Like the unmaintained notices above these are NOT
    # vulnerabilities (cargo-audit's --json gate counts 0 vulnerabilities);
    # they flag `unsafe` blocks upstream can misuse. Both are confined to the
    # mobile/desktop native shell and neither is reachable from the shipped
    # `omnibus` server. Fixing them requires an upstream Dioxus bump we don't
    # control (both crates are pinned deep under the git-pinned wry/gtk tree).
    # Triaged 2026-07-06 (issue #773). Revisit when Dioxus upgrades wry/gtk.
    #
    # NB: RUSTSEC-2026-0186 (memmap2 unchecked pointer offset) is the third
    # advisory from that triage. It was NOT ignored — it was the one path
    # reachable from the default (non-mobile) build (memmap2 → subsecond →
    # dioxus-core), so it was fixed for real by bumping memmap2 0.9.10 → 0.9.11
    # (`cargo update -p memmap2`; patched in >= 0.9.11), which needs no change
    # to the Dioxus pin. See Cargo.lock.
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18.5 VariantStrIter unsoundness — mobile/desktop only via wry→gtk→glib (patched in glib 0.20, forced by upstream gtk-rs 0.18 pin under wry); not reachable in the server build" },
    { id = "RUSTSEC-2026-0097", reason = "rand 0.7.3 unsoundness — aliased mutable reference when a custom `log` logger calls rand::rng()/thread_rng() and ThreadRng reseeds mid-log; build-dependency only via phf_generator 0.8 (ammonia/html5ever codegen under wry), never links into any runtime binary and that logger-reseed path is not exercised in a build script" },
]

# ---------------------------------------------------------------------------
# Licenses
# ---------------------------------------------------------------------------
# Permissive set covering everything currently in the dependency tree.
# Add entries here (never remove) when `cargo deny check licenses` reports
# an unlicensed or denied crate after a dependency bump. Crate-specific
# carve-outs go under `[[licenses.exceptions]]` below so the global allow
# list stays minimal.
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # Boost Software License — permissive, OSI-approved. Used by `xxhash-rust`
    # (transitive via dioxus-fullstack).
    "BSL-1.0",
    # Community Data License Agreement, Permissive 2.0 — Linux Foundation
    # license used by `webpki-roots` (Mozilla CA bundle data). Permissive;
    # any TLS-via-rustls project hits this.
    "CDLA-Permissive-2.0",
    # BSD Zero Clause — public-domain-equivalent, OSI-approved (more permissive
    # than MIT: no attribution required). Used by `quoted_printable` (transitive
    # via `lettre`, the Send-to-Kindle SMTP client).
    "0BSD",
]
# With version = 2 the allow-list above is authoritative: any license not
# listed is denied, and a crate whose license cannot be determined is an
# error. (The pre-v2 `unlicensed` / `copyleft` keys were removed in v2.)

# Per-crate license carve-outs. Prefer this over expanding `allow` when a
# single crate is the only user of an otherwise-undesirable license.
[[licenses.exceptions]]
# `epub` is GPL-3.0, used in `omnibus-db` to parse EPUB metadata. This is a
# direct dependency carried over from before the licenses check was wired up;
# the rest of the workspace is MIT. Scoping the GPL-3.0 acceptance to this one
# crate keeps the policy honest — any other GPL crate sneaking in via a future
# dependency bump still fails the check. Revisit by either porting metadata
# extraction onto a non-GPL EPUB parser or accepting the copyleft posture
# explicitly in LICENSE.
allow = ["GPL-3.0"]
name = "epub"

[[licenses.exceptions]]
# `libfuzzer-sys` is `(MIT OR Apache-2.0) AND NCSA`. NCSA (University of
# Illinois/NCSA Open Source License) is permissive and OSI-approved, but is
# the only crate in the tree that uses it, so scoping it here keeps the global
# allow list lean. The crate enters the lock graph via `rav1e → ravif → image`
# (and `dioxus-desktop`); our `image` features (`jpeg`, `png`, `webp`) do not
# enable `avif`, so this never actually links into the runtime binary.
allow = ["MIT", "Apache-2.0", "NCSA"]
name = "libfuzzer-sys"

# ---------------------------------------------------------------------------
# Bans
# ---------------------------------------------------------------------------
# Duplicates are audited in docs/dependency-audit.md — entries below cover
# the families listed there plus their proc-macro/companion crates
# (e.g. `thiserror-impl`, `rand_core`, `foldhash`, `const-serialize-macro`)
# that ship in lockstep with the duplicated runtime crate.
# Warn rather than deny so new first-party skew is visible without blocking
# CI until the Dioxus patches are replaced with plain crates.io versions.
[bans]
multiple-versions = "warn"
# Deny crates that should never appear in the dependency tree.
deny = []

# ---------------------------------------------------------------------------
# Accepted / blocked duplicate families (see docs/dependency-audit.md)
# ---------------------------------------------------------------------------
skip = [
    # --- WebSocket stack split (Dioxus vs Axum) ---
    # tungstenite: 0.27 (async-tungstenite/dioxus-fullstack), 0.28
    # (dioxus-devtools), 0.29 (axum). Blocked by upstream Dioxus.
    { name = "tungstenite", version = "0.27.0" },
    { name = "tungstenite", version = "0.28.0" },
    # tokio-tungstenite: 0.28 (dioxus), 0.29 (axum). Same root cause.
    { name = "tokio-tungstenite", version = "0.28.0" },

    # --- thiserror v1 ---
    # thiserror 1 reaches the tree by two independent routes: (1) `gloo-net`
    # (→ dioxus-fullstack, a DIRECT dep of omnibus/omnibus-frontend, NOT under
    # the native shell) in the default server build; (2) the desktop/mobile
    # native shell (cairo-rs, gio, glib, jni, ndk) under wry/tao. Our first-
    # party crates are on v2. No explicit skip is listed here: with the wry/tao
    # skip-tree below in effect, `cargo deny check bans` already collapses
    # thiserror to a single counted version, so an explicit skip trips its
    # `unnecessary-skip` lint. If the native-shell (skip-tree) paths ever go
    # away, re-add `{ name = "thiserror"/"thiserror-impl", version = "1.0.69" }`
    # here to keep the gloo-net path triaged. Blocked until upstream bumps to
    # thiserror 2.

    # --- const-serialize alpha ---
    # 0.7.2 from crates.io manganis; 0.8.0-alpha.0 bundled in Dioxus git tag.
    # Blocked by Dioxus pin.
    { name = "const-serialize", version = "0.7.2" },
    { name = "const-serialize-macro", version = "0.7.2" },

    # --- getrandom + rand_core (four-way getrandom split) ---
    # 0.1 from rand 0.7.3 (phf_generator, build-dep only).
    # 0.2 intentionally kept for argon2/rand_core 0.6 auth path in db.
    # 0.3 from tungstenite/rand 0.9. 0.4 runtime via uuid (see below).
    # rand_core 0.5/0.6/0.9 mirror those paths.
    # See docs/dependency-audit.md for upgrade trigger conditions.
    { name = "getrandom", version = "0.1.16" },
    { name = "getrandom", version = "0.2.17" },
    { name = "getrandom", version = "0.3.4" },
    # getrandom 0.4 pulled in since the June triage via `uuid 1.x` — a RUNTIME
    # dependency: db::helpers::mint_uuid calls Uuid::new_v4() in non-test code
    # (uuid's `v4` feature → getrandom 0.4), so it DOES link into the shipped
    # server binary; uuid also enters via cfb/infer under dioxus-asset-resolver.
    # (tempfile 3 is the dev/test path.) Accepted — this is the modern getrandom
    # line and cannot collapse onto the 0.2 auth pin without an argon2 upgrade.
    { name = "getrandom", version = "0.4.2" },
    { name = "rand_core", version = "0.5.1" },
    { name = "rand_core", version = "0.6.4" },
    # rand_core 0.9 appeared alongside rand 0.9 (tungstenite websocket path,
    # see below). Mirrors that split; blocked by the same upstream pin.
    { name = "rand_core", version = "0.9.5" },

    # --- hashbrown four-way split ---
    # 0.14 from dashmap (dioxus-server), 0.15 from sqlx-core,
    # 0.16 from lru (dioxus-server), 0.17 from indexmap.
    # All internal impl details — not in any public API surface.
    { name = "hashbrown", version = "0.14.5" },
    { name = "hashbrown", version = "0.15.5" },
    { name = "hashbrown", version = "0.16.1" },
    # foldhash ships one copy per hashbrown minor: 0.1 with hashbrown 0.15,
    # 0.2 with hashbrown 0.16. Both are internal impl details of hashbrown.
    { name = "foldhash", version = "0.1.5" },
    { name = "foldhash", version = "0.2.0" },

    # --- convert_case (proc-macro only) ---
    # 0.4 from derive_more 0.99.20 (transitive via Dioxus desktop/mobile);
    # 0.8 from Dioxus proc-macro crates; 0.10 from derive_more (dioxus-fullstack).
    # Not in any runtime binary.
    { name = "convert_case", version = "0.4.0" },
    { name = "convert_case", version = "0.8.0" },

    # --- rand 0.7 / 0.8 (build-dep only) + 0.9 (websocket) ---
    # phf_generator (build dep of ammonia→html5ever) uses rand 0.7 and 0.8
    # via two separate phf_generator versions on the codegen path — never
    # links into the runtime binary. rand 0.9 is the runtime copy pulled by
    # tungstenite (masking-key RNG) across all three websocket versions;
    # blocked by the same Dioxus/Axum websocket split as tungstenite above.
    { name = "rand", version = "0.7.3" },
    { name = "rand", version = "0.8.6" },
    { name = "rand", version = "0.9.4" },

    # --- webpki-roots ---
    # 0.26 from sqlx-core; 1.0 from hyper-rustls (reqwest).
    # Collapses when sqlx bumps its rustls deps.
    { name = "webpki-roots", version = "0.26.11" },
]

# ---------------------------------------------------------------------------
# Accepted duplicate SUBTREES (skip-tree)
# ---------------------------------------------------------------------------
# `cargo deny check bans` scans the whole workspace across all targets —
# including `omnibus-mobile`, which is out of default-members — so it surfaces
# a large tail of duplicates from the Dioxus **desktop/mobile native shell**
# that a default-build `cargo tree -d` never shows (wry/tao → webkit2gtk/gtk-rs
# on Linux, muda/tray-icon, plus the windows-* and core-foundation/core-graphics
# platform crates). These are old pinned versions carried by the native webview
# stack (e.g. bitflags 1, derive_more 0.99, heck 0.4, html5ever/markup5ever,
# string_cache, jni, png, raw-window-handle, rustc-hash, siphasher, the
# windows-sys/windows-targets family). None link into the shipped `omnibus`
# server binary — they exist only under the native shell. Collapsing them
# requires upstream wry/tao to migrate off gtk-rs 0.18 / bitflags 1 etc., which
# is gated on the Dioxus pin (see [patch.crates-io] in root Cargo.toml). We
# skip the whole subtree rather than enumerate ~40 leaf crates that all share
# this single root cause. Revisit when Dioxus upgrades wry/tao.
skip-tree = [
    { name = "wry" },
    { name = "tao" },
]

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
# Allow crates.io plus the DioxusLabs monorepo git source that the workspace
# patches all dioxus-* crates from (see [patch.crates-io] in root Cargo.toml).
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # All dioxus-* crates are git-patched to this repo until they publish
    # the matching version to crates.io — see root Cargo.toml for rationale.
    "https://github.com/DioxusLabs/dioxus",
]
