[workspace]
members = ["server", "mobile", "shared", "frontend", "db"]
# Exclude `mobile` from default workspace-wide commands (`cargo build`,
# `cargo clippy`, etc.) to avoid unifying the mutually exclusive
# `omnibus-frontend` feature flags (`web` + `mobile`). Build mobile
# explicitly with `cargo build -p omnibus-mobile`.
default-members = ["server", "shared", "frontend"]
resolver = "2"

# Centralized dependency versions shared across crates. Crates pull these in
# via `<dep>.workspace = true` (or `{ workspace = true, features = [...] }`
# when they need extra features beyond the workspace baseline). Only deps
# that appear in 2+ crates at the same version are centralized here — single-
# crate deps stay in their own Cargo.toml, and framework-specific deps with
# divergent features (dioxus, sqlx, axum) are intentionally left per-crate.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Declared with no features at the workspace level — `default-features = false`
# is preserved so the frontend WASM build doesn't accidentally pull the
# multi-thread runtime in. Consumers opt into the features they need
# (`macros`, `rt-multi-thread`, `sync`, `time`).
tokio = { version = "1", default-features = false }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"

# Pin every dioxus-* crate to the v0.7.9 monorepo tag. The `dx` CLI we ship via
# nixpkgs-unstable (see flake.nix) ships 0.7.6–0.7.9 point releases without
# matching crates.io publishes for the libraries (last published lib version is
# 0.7.5), so `dx serve` refuses to start with an "incompatible versions" banner.
# Patching to the matching git tag keeps the lib + CLI in lockstep until the
# next coordinated crates.io release.
#
# SECURITY NOTE — `cargo audit` blind spot: `cargo audit` keys RUSTSEC advisory
# lookups on crates.io package name + version. These crates resolve by git SHA,
# not a crates.io version, so any advisory filed against a patched Dioxus crate
# will NOT surface in `cargo audit` (and therefore not in CI). Severity is low —
# Dioxus is a UI framework, not a network/crypto dep — but the gap is silent.
# Mitigation: on every Dioxus bump, manually review the DioxusLabs changelog and
# GitHub security advisories (https://github.com/DioxusLabs/dioxus/security/advisories)
# for the new tag. Exit condition: once Dioxus publishes the matching version to
# crates.io, replace these git patches with plain `version = "..."` entries and
# delete this whole note (the audited path is then restored automatically).
[patch.crates-io]
dioxus = { git = "https://github.com/DioxusLabs/dioxus", tag = "v0.7.9" }
dioxus-asset-resolver = { git = "https://github.com/DioxusLabs/dioxus", tag = "v0.7.9" }
dioxus-cli-config = { git = "https://github.com/DioxusLabs/dioxus", tag = "v0.7.9" }
