version: "0.5"

processes:
  server:
    # dev-serve-fg.sh resolves a free port inside this worktree's window before
    # exec'ing dx serve, so two worktrees running the stack at once never
    # collide. It also binds 0.0.0.0 and publishes the chosen port to
    # .claude/runtime/ — see the script for the LAN-exposure caveat.
    command: nix develop .#web --command scripts/dev-serve-fg.sh

  android:
    command: nix develop .#mobile --command dx serve --platform android --package omnibus-mobile
    disabled: true

  ios:
    # Native SwiftUI app (omnibus-ios/): boot the newest iPhone simulator,
    # build, install, launch. System xcodebuild — no nix shell.
    command: just ios-sim
    disabled: true

  playwright:
    command: nix develop ../..#e2e --command pnpm exec playwright test --ui
    working_dir: ui_tests/playwright
    disabled: true
