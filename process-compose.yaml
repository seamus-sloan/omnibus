version: "0.5"

processes:
  server:
    # --addr 0.0.0.0 binds all interfaces so other LAN devices can reach the
    # dev server; LAN origins additionally need OMNIBUS_PUBLIC_ORIGIN +
    # OMNIBUS_SECURE_COOKIES=0 (see .env.example). Trusted networks only — this
    # exposes the dev server (auth endpoints included) to the whole LAN.
    command: nix develop .#web --command dx serve --platform web --fullstack --port 3000 --addr 0.0.0.0 --package omnibus

  android:
    command: nix develop .#mobile --command dx serve --platform android --package omnibus-mobile
    disabled: true

  ios:
    # Native SwiftUI app (omnibus-ios/): boot the newest iPhone simulator,
    # build, install, launch. System xcodebuild — no nix shell.
    command: just ios-sim
    disabled: true

  ios-hybrid:
    # Hybrid WebView shell (mobile/ crate) on iOS. The native `ios` process
    # above is the iOS surface going forward.
    command: nix develop .#mobile --command dx serve --platform ios --package omnibus-mobile
    disabled: true

  playwright:
    command: nix develop ../..#e2e --command pnpm exec playwright test --ui
    working_dir: ui_tests/playwright
    disabled: true
