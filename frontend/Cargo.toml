[package]
name = "omnibus-frontend"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
dioxus = { version = "0.7", features = ["fullstack"] }
dioxus-router = "0.7"
omnibus-shared = { path = "../shared" }
omnibus-db = { path = "../db", optional = true }
serde.workspace = true
# Non-optional: `view_prefs` / `index_prefs` serialize prefs to JSON on every
# target (the SSR build must compile the code path even though `client_store`
# makes it a no-op there).
serde_json.workspace = true
# Typed transport errors for the feature-gated `data` layer (#96). Always on:
# `data::DataError` is referenced by callers under every platform feature, so
# the derive must be available in all builds (including the no-feature
# default-members check). Version matches `omnibus-db`.
thiserror.workspace = true
# Foreign-failure-space errors for the mobile-only `offline` module (network,
# filesystem) per `.claude/rules/02-error-handling.md`. Optional, enabled by
# `mobile` — not needed by the web/server builds. Version matches `omnibus-db`.
anyhow = { version = "1", optional = true }
reqwest = { workspace = true, optional = true, features = ["multipart"] }
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"], optional = true }
gloo-timers = { version = "0.4", features = ["futures"], optional = true }
# `web-sys` is enabled only on the WASM client for `Window::local_storage()`.
# F1.3 view-mode / sort / filter prefs are persisted there per library path.
# F1.11: FormData/Blob/BlobPropertyBag are used by `data::upload_author_photo`
# to build a multipart body for the author profile photo upload — the only
# path that needs to ship raw bytes from the web client.
# Element/HtmlElement/FocusEvent/EventTarget/Node (#992): ChipEditor's blur
# handler downcasts to the raw `web_sys::FocusEvent` to read `related_target`
# and check DOM containment against the editor's own root, so Tab moving
# focus to a chip's Remove button doesn't close the editor.
# Navigator/Document/VisibilityState: `session_tracker`'s tab-hide flush —
# `navigator.sendBeacon` delivery plus the visibilitychange/pagehide
# listeners that end a reading/listening segment on tab hide or close.
web-sys = { version = "0.3", features = ["Window", "Storage", "KeyboardEvent", "FormData", "Blob", "BlobPropertyBag", "Element", "HtmlElement", "FocusEvent", "EventTarget", "Node", "Navigator", "Document", "VisibilityState"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
# sqlx + tokio are needed at the type level by rpc.rs when building server
# functions (PoolExt = Extension<SqlitePool>, #[tokio::spawn] for reindex).
# Kept as optional deps enabled only by the `server` feature. Tokio is
# pulled in with no default features so each consuming feature opts into
# only what it needs — mobile gets `sync` for `watch`, server gets the
# multi-thread runtime + macros for `#[tokio::main]`-style usage in rpc.rs.
# held at 0.8: see db/Cargo.toml — 0.9's SqlSafeStr requirement is a nontrivial
# migration across the db crate; keep all three crates on 0.8 in lockstep.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"], optional = true }
tokio = { workspace = true, optional = true }
# Server-side structured logging for #[cfg(feature = "server")] code paths
# (rpc.rs auth extractor errors). Optional so the WASM client build doesn't
# pull tracing into the bundle.
tracing = { workspace = true, optional = true }

# Decodes the quote card's base64 PNG data URL before staging it for the
# native share sheet (`native_share`). Mobile-only.
base64 = { version = "0.22", optional = true }

# Offline store (mobile): replica cache + mutation outbox + download registry
# in one SQLite file under the app data dir (`offline` module). Held at
# 0.32.x deliberately: its libsqlite3-sys requirement (^0.30) must unify with
# sqlx 0.8's — cargo permits one `links = "sqlite3"` crate per dep graph, so
# bump rusqlite only in lockstep with sqlx.
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
# Loopback media server (mobile): serves downloaded EPUB/audio files and the
# offline image cache to the WebView at http://127.0.0.1:{port}. Version
# matches `server/`'s axum so the workspace resolves a single copy.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"], optional = true }
# Streams Range slices of downloaded media from disk without buffering whole
# files in memory (`ReaderStream` in `offline::media`).
tokio-util = { version = "0.7", default-features = false, features = ["io"], optional = true }
# Per-boot random auth token for the loopback media server. 0.2 matches a
# version already resolved in Cargo.lock (avoids adding a third duplicate).
getrandom = { version = "0.2", optional = true }

# Real ZIP validation for a downloaded EPUB: reading each member to EOF is
# what checks the CRC-32 the central directory recorded for it, which is the
# only thing that catches a same-length splice preserving the archive's
# structure. Mobile-only (the offline layer never compiles for web), and
# already in the tree via `epub`, so it unifies rather than adding a build.
zip = { version = "3", default-features = false, features = ["deflate"], optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
# UIKit bindings for `native_share` — WKWebView has no usable Web Share API,
# so the reader's Share actions present a real UIActivityViewController.
# Versions match what wry (dioxus's WebView backend) already resolves.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "UIActivity",
    "UIActivityViewController",
    "UIApplication",
    "UIDevice",
    "UIPopoverPresentationController",
    "UIPresentationController",
    "UIResponder",
    "UIView",
    "UIViewController",
    "UIWindow",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }

[target.'cfg(target_os = "android")'.dependencies]
# Resolves `Context.getFilesDir()` via JNI so `data::app_dirs::data_dir()` can
# persist the server URL / auth token on Android (#837), mirroring the iOS
# fix. Versions match what tao (dioxus's `mobile` windowing backend) already
# resolves, so this doesn't pull in a second copy of either crate.
jni = { version = "0.21", optional = true }
ndk-context = { version = "0.1", optional = true }

[dev-dependencies]
# Sandboxed temp dirs for the mobile `token_store` / `app_dirs` file tests.
tempfile.workspace = true
# `SerializedFormData`/`SerializedMouseData` — synthetic `FormEvent`/`MouseEvent`
# construction for tests that call a signal-driven handler directly (e.g.
# `settings::library`'s `save_settings_handler`/`scan_library_handler`). Not a
# target-gated dev-dep: `VirtualDom`-backed handler tests compile and run on
# wasm32 too, so this needs to be in the unification unit for every target.
dioxus-html = { version = "0.7", features = ["serialize"] }

# In-memory pool + seed fixtures for the `server`-gated rpc tests. Gated off
# wasm32: those tests only compile under the (native) `server` feature, and an
# unconditional dev-dep would drag sqlx/tokio-net into the wasm test closure
# that CI's `clippy (frontend-web) --all-targets` builds (mio can't compile
# for wasm).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
omnibus-db = { path = "../db", features = ["test-support"] }
# #[tokio::test] for the mobile `offline` module's store/media/loopback tests.
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
default = []
# Exposes the SSR render-smoke harness (`test_support`) to dependents. Pulls in
# `server`, since the harness uses `dioxus::ssr`, which only exists there. The
# crate's own render tests reach the harness through `cfg(test)` and don't need
# this feature; it's here so another crate could consume the helper (rule 03).
test-support = ["server"]
# Web client (WASM): uses dioxus-fullstack server-function client stubs.
# tokio/sync (sync-only, WASM-safe) backs `data::web_auth_state` — a watch
# channel that lets data-layer 401s notify the router to redirect to /login
# (#57), mirroring the mobile token_store pattern.
web = [
    "dioxus/web",
    "dep:gloo-net",
    "dep:gloo-timers",
    "dep:web-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:tokio",
    "tokio/sync",
]
# Native mobile client: talks to `/api/*` REST routes via reqwest.
# tokio is enabled for `sync::watch` — used by `data::token_store` to
# notify the UI when auth state changes so screens redirect to /login
# without a polling loop. `tokio/time` backs the debounce sleep in the
# mobile search screen (`pages::search_mobile`); reqwest's runtime already
# drives the timer, so no extra runtime/macro features are needed.
mobile = [
    "dep:reqwest",
    "dep:zip",
    "dep:tokio",
    "tokio/sync",
    "tokio/time",
    # rt/net/fs/io-util back the `offline` module: the loopback media server
    # runs a current-thread runtime on its own thread, streams downloaded
    # files with tokio::fs, and the download engine appends fetched chunks.
    "tokio/rt",
    "tokio/net",
    "tokio/fs",
    "tokio/io-util",
    "dep:tracing",
    "dep:anyhow",
    "dep:jni",
    "dep:ndk-context",
    "dep:base64",
    "dep:rusqlite",
    "dep:axum",
    "dep:tokio-util",
    "dep:getrandom",
]
# Server-function bodies: compiles the server-side halves of the #[get]/#[post]
# functions in rpc.rs against the real DB layer. Used by `server/` when
# building the fullstack native binary. The DB work lives in `omnibus-db`;
# this feature just pulls it in alongside dioxus/server's server-fn codegen.
#
# NOTE: must be named literally `server` — the dioxus_fullstack_macro
# hardcodes `#[cfg(feature = "server")]` inside the expanded #[get]/#[post]
# bodies, so renaming it (e.g. to `server-fns`) makes the server halves
# compile to empty stubs.
server = [
    "dioxus/server",
    "dep:omnibus-db",
    "dep:sqlx",
    "dep:tokio",
    "tokio/macros",
    "tokio/rt-multi-thread",
    "dep:tracing",
]
