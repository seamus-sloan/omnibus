# Codecov configuration — report-only.
#
# Coverage here measures the unit/integration suite over the native crates
# (server + mobile-feature Rust); the wasm32 `web` frontend and the E2E suites
# are not instrumented, so treat the absolute number as a floor, not a target.
# Both status checks are `informational: true` — Codecov posts the PR comment
# and per-line annotations but NEVER sets a failing commit status, matching the
# non-blocking `coverage` job in .github/workflows/rust.yml.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# `unit` carries the Rust suite's upload; `ios` carries the omnibus-ios
# unit suite (ios-tests.yml). Leaves room for an `e2e` flag later without
# reshaping the project number.
flags:
  unit:
    paths:
      - db/
      - server/
      - shared/
      - frontend/
  ios:
    paths:
      - omnibus-ios/

# PR comment: show the overall + per-flag diff, and don't nag when there's
# nothing to say.
comment:
  layout: "reach, diff, flags, files"
  require_changes: false
