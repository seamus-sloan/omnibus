[application]
name = "Omnibus"

[background]
audio = true

[bundle]
# Unique reverse-DNS id used for the iOS CFBundleIdentifier and the Android
# applicationId. Required for real code signing / device installs — the
# default `com.example.*` can't be provisioned under a real Apple team.
# Must exactly match the App Store Connect app record so `dx bundle` stamps
# the right CFBundleIdentifier — the TestFlight upload
# (.github/workflows/testflight.yml) rejects a mismatch.
identifier = "com.omnibus.mobile"

[android]
uses_cleartext_traffic = true

# Check-in's barcode scanner calls `getUserMedia` from the WebView. dx maps
# this one entry to both `NSCameraUsageDescription` (the iOS prompt's text) and
# `<uses-permission android:name="android.permission.CAMERA">`. wry already
# grants the WebView's request on both platforms (its `WKUIDelegate`
# `requestMediaCapturePermissionForOrigin` and `RustWebChromeClient`
# `onPermissionRequest`), so the manifest declaration is all that's missing.
[permissions.camera]
description = "Omnibus uses the camera to scan a book's barcode when you check in a print copy."

[ios.raw]
# Omnibus is a self-hosted app; users connect over HTTP on their LAN or via
# Tailscale. WKWebView enforces ATS and would otherwise block <img> loads from
# http:// origins even though reqwest (which uses its own TCP stack) is exempt.
# InWebContent scopes the exception to WKWebView loads only (iOS 10+).
info_plist = """
<key>NSAppTransportSecurity</key>
<dict>
	<key>NSAllowsArbitraryLoadsInWebContent</key>
	<true/>
</dict>
"""
